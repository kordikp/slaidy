@keyframes wp{0.00%{transform:translateX(0.0px)}8.00%{transform:translateX(0.0px)}9.11%{transform:translateX(0.4px)}10.22%{transform:translateX(3.5px)}11.33%{transform:translateX(11.9px)}12.44%{transform:translateX(28.1px)}13.56%{transform:translateX(54.9px)}14.67%{transform:translateX(94.8px)}15.78%{transform:translateX(150.6px)}16.89%{transform:translateX(224.7px)}18.00%{transform:translateX(320.0px)}19.11%{transform:translateX(415.3px)}20.22%{transform:translateX(489.4px)}21.33%{transform:translateX(545.2px)}22.44%{transform:translateX(585.1px)}23.56%{transform:translateX(611.9px)}24.67%{transform:translateX(628.1px)}25.78%{transform:translateX(636.5px)}26.89%{transform:translateX(639.6px)}28.00%{transform:translateX(640.0px)}80.00%{transform:translateX(640.0px)}80.78%{transform:translateX(639.6px)}81.56%{transform:translateX(636.5px)}82.33%{transform:translateX(628.1px)}83.11%{transform:translateX(611.9px)}83.89%{transform:translateX(585.1px)}84.67%{transform:translateX(545.2px)}85.44%{transform:translateX(489.4px)}86.22%{transform:translateX(415.3px)}87.00%{transform:translateX(320.0px)}87.78%{transform:translateX(224.7px)}88.56%{transform:translateX(150.6px)}89.33%{transform:translateX(94.8px)}90.11%{transform:translateX(54.9px)}90.89%{transform:translateX(28.1px)}91.67%{transform:translateX(11.9px)}92.44%{transform:translateX(3.5px)}93.22%{transform:translateX(0.4px)}94.00%{transform:translateX(0.0px)}100.00%{transform:translateX(0.0px)}}
@keyframes bo{0%,6.0%{opacity:0}8.0%,28.0%{opacity:1}31.0%,77.0%{opacity:0}80.0%,94.0%{opacity:1}97.0%,100%{opacity:0}}
@keyframes grow{0%{transform:scaleY(0)}5%{transform:scaleY(1.1);animation-timing-function:ease-in-out}8%,100%{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(0)}3.5%{transform:scale(1.35)}6%,100%{transform:scale(1)}}
@keyframes spark{0%{opacity:1;transform:scale(0) rotate(0)}3%{opacity:1;transform:scale(1) rotate(45deg)}8%,100%{opacity:0;transform:scale(.2) rotate(90deg)}}
@keyframes ping{0%{opacity:.9;transform:scale(1)}12%,100%{opacity:0;transform:scale(3.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media print,(prefers-reduced-motion:reduce){.mv,.wp,.bo,.bar,.dot,.spark,.ping,.spin,.caret{animation:none!important}}
