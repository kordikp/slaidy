<!doctype html><meta charset=utf-8><iframe id=f src="/index.html" style="width:1500px;height:940px;border:0"></iframe>
<script>
const E=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const L=[],ok=(n,c,x)=>L.push((c?'PASS ':'FAIL ')+E(n)+(x?'  '+E(x):''));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const spill=()=>{if(!document.getElementById('out'))
  document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+
    '\nERROR the file stopped here — it hung rather than finished</pre>');};
const __watchdog=setTimeout(spill,55000);
addEventListener('load',async()=>{
 const W=f.contentWindow,d=f.contentDocument; await (f.contentWindow.__ready||wait(3500)); await wait(120); const w=W.__api;
 try{
  // a slide with room, then push it over the edge with a picture
  // a slide that fits, has words, and carries no picture of its own yet
  let i=-1;
  for(let k=0;k<w.S.slides.length;k++){
    const x=w.S.slides[k];
    if(x.layout!=='text'||!(x.body||'').trim()||/!\[\[/.test(x.body))continue;
    w.cur=k;w.paint();await wait(120);
    if(!d.getElementById('overflag').classList.contains('on')){i=k;break;}
  }
  ok('found a text slide with room',i>=0,'slide '+(i+1));
  ok('it fits to begin with',!d.getElementById('overflag').classList.contains('on'));
  const before=w.S.slides[i].body;
  // enough to overflow on its own: an inline figure is capped now, so a figure
  // alone no longer guarantees a spill
  const filler=Array.from({length:26},(_,n)=>
    'Line '+(n+1)+' of prose that exists only to make this slide too long to fit.').join('\n\n');
  w.S.slides[i].body=before+'\n\n![[fig-panel-1]]\n\n'+filler;
  const tooLong=w.S.slides[i].body.length;
  w.paint();await wait(300);
  ok('now it overflows',d.getElementById('overflag').classList.contains('on'));

  // ---------- what spills is still reachable ----------
  const tx=d.querySelector('#sheet .stage .tx');
  ok('the frame scrolls in the editor',tx.scrollHeight>tx.clientHeight+4,
     tx.scrollHeight+' of '+tx.clientHeight);
  ok('so the spilled part can be reached',getComputedStyle(tx).overflowY!=='hidden',
     getComputedStyle(tx).overflowY);
  const sb=tx.offsetWidth-tx.clientWidth;
  ok('and no scrollbar changes the geometry',sb===0,sb+'px of scrollbar');

  // ---------- the warning does something ----------
  const flag=d.getElementById('overflag');
  const acts=[...flag.querySelectorAll('button')].map(b=>b.dataset.fix);
  ok('the warning offers fixes',acts.join(',')==='tidy,small,notes',acts.join(','));

  flag.querySelector('[data-fix="small"]').click();await wait(250);
  ok('smaller picture shrinks the last figure',/!\[\[fig-panel-1\|85%\]\]/.test(w.S.slides[i].body),
     (w.S.slides[i].body.match(/!\[\[[^\]]*\]\]/)||[''])[0]);
  w.undo();await wait(200);

  const n0=(w.S.slides[i].notes||'').length;
  d.getElementById('overflag').querySelector('[data-fix="notes"]').click();await wait(300);
  ok('moving the tail lengthens the notes',(w.S.slides[i].notes||'').length>n0,
     n0+' → '+(w.S.slides[i].notes||'').length);
  ok('and shortens the body',w.S.slides[i].body.length<tooLong,
     tooLong+' → '+w.S.slides[i].body.length);
  ok('which clears the warning',!d.getElementById('overflag').classList.contains('on'));
  w.undo();await wait(250);

  d.getElementById('overflag').querySelector('[data-fix="tidy"]').click();await wait(400);
  const fixed=!d.getElementById('overflag').classList.contains('on');
  ok('fit it either fits it or shrinks the type trying',
     fixed||w.S.slides[i].textScale<100,
     `${w.S.slides[i].layout} · type ${w.S.slides[i].textScale} % · ${fixed?'fits':'still over'}`);
  w.undo();await wait(200);
  w.S.slides[i].body=before;w.paint();await wait(200);

  // ---------- controls sit on the picture ----------
  const fi=w.S.slides.findIndex(x=>w.firstFig(x)&&w.S.figs[w.firstFig(x)]);
  w.cur=fi;w.paint();await wait(250);
  const hero=d.querySelector('#sheet .inlinefig .figbox');
  ok('the figure carries its own controls',hero.classList.contains('fx')&&
     !!hero.querySelector('.figbar')&&!!hero.querySelector('.figgrip'));
  const btns=[...hero.querySelectorAll('.figbar button')].map(b=>b.dataset.x);
  ok('edit, replace and remove',btns.join(',')==='ed,sw,rm',btns.join(','));

  // drag the grip and the size follows
  const svg=hero.querySelector('svg'), grip=hero.querySelector('.figgrip');
  const w0=svg.getBoundingClientRect().width;
  const gr=grip.getBoundingClientRect();
  grip.dispatchEvent(new W.MouseEvent('mousedown',{clientX:gr.left+8,clientY:gr.top+8,bubbles:true}));
  await wait(40);
  d.dispatchEvent(new W.MouseEvent('mousemove',{clientX:gr.left+8-160,clientY:gr.top+8,bubbles:true}));
  await wait(60);
  ok('dragging shows the percentage',hero.classList.contains('sizing')&&
     /\d+ %/.test(hero.querySelector('.figpct').textContent),
     hero.querySelector('.figpct').textContent);
  d.dispatchEvent(new W.MouseEvent('mouseup',{bubbles:true}));
  await wait(250);
  ok('and it sticks',w.figBlocks(w.S.slides[fi])[0].size<100,w.figBlocks(w.S.slides[fi])[0].size+' %');
  const w1=d.querySelector('#sheet .inlinefig .figbox svg').getBoundingClientRect().width;
  ok('the picture really is smaller',w1<w0*0.9,Math.round(w0)+' → '+Math.round(w1));
  ok('and it survives markdown',
     new RegExp('\\|'+w.figBlocks(w.S.slides[fi])[0].size+'%').test(w.slideMd(w.S.slides[fi])),
     (w.slideMd(w.S.slides[fi]).match(/!\[\[[^\]]*\]\]/)||[''])[0]);
  w.undo();await wait(200);

  // ---------- an inline picture has the same controls ----------
  const ii=w.S.slides.findIndex(x=>/!\[\[/.test(x.body||''));
  w.cur=ii;w.paint();await wait(300);
  const box=d.querySelector('#bd .inlinefig .figbox');
  ok('an inline picture too',!!box&&box.classList.contains('fx')&&!!box.querySelector('.figgrip'));
  ok('with the same three buttons',
     [...box.querySelectorAll('.figbar button')].map(b=>b.dataset.x).join(',')==='ed,sw,rm');
  const bs=w.blocks(w.S.slides[ii].body).length;
  box.querySelector('[data-x="rm"]').click();await wait(250);
  ok('remove takes it out of the body',w.blocks(w.S.slides[ii].body).length===bs-1,
     bs+' → '+w.blocks(w.S.slides[ii].body).length);
  w.undo();await wait(200);
  ok('and undo puts it back',w.blocks(w.S.slides[ii].body).length===bs);

  // ---------- a figure is contained by its column, on both axes ----------
  // It used to be width only, so a figure among text could be taller than the
  // slide and push everything under it off the bottom — and the fix for that
  // was a measured 340px cap, which meant a figure alone on a slide could never
  // use the room it had. The column bounds it now, so 100% means what it says.
  const j=w.S.slides.findIndex(x=>x.layout==='text');
  w.cur=j;w.S.slides[j].body='![[fig-panel-1|100%]]';w.paint();await wait(300);
  const st=d.getElementById('stage'),col=st.querySelector('.tx');
  const k2=st.getBoundingClientRect().width/1280;
  const fb=st.querySelector('.inlinefig .figbox');
  const fh=fb.getBoundingClientRect().height/k2, fw=fb.getBoundingClientRect().width/k2;
  const ch=col.getBoundingClientRect().height/k2, cw=col.getBoundingClientRect().width/k2;
  ok('a figure alone at 100% takes the column it is in',fh>ch*0.9,
     Math.round(fh)+' of '+Math.round(ch)+'px');
  ok('and never more than that',fh<=ch+1&&fw<=cw+1,
     Math.round(fw)+'×'+Math.round(fh)+' in '+Math.round(cw)+'×'+Math.round(ch));
  ok('it keeps the drawing\'s shape',
     Math.abs(fw/fh-800/450)<0.05,(fw/fh).toFixed(2));
  w.S.slides[j].body='![[fig-panel-1|50%]]';w.paint();await wait(500);
  const fb2=d.getElementById('stage').querySelector('.inlinefig .figbox');
  const half=fb2?fb2.getBoundingClientRect().width/k2:0;
  ok('a percentage is still of the largest that fits',Math.abs(half-fw/2)<4,
     Math.round(half)+' vs half of '+Math.round(fw));


  // ---------- the backdrop resizes, and to more than 100% ----------
  const bi2=w.S.slides.findIndex(x=>w.firstFig(x)&&w.S.figs[w.firstFig(x)]);
  w.cur=bi2;w.S.slides[bi2].layout='background';w.setFigSize(w.S.slides[bi2],0,100);
  w.paint();await wait(400);
  const stg=()=>d.getElementById('stage');
  const kk=()=>stg().getBoundingClientRect().width/1280;
  const bw=()=>{const v=stg().querySelector('.bgl svg');
    return v?Math.round(v.getBoundingClientRect().width/kk()):0;};
  ok('Behind puts the figure under the text',!!stg().querySelector('.bgl'));
  const base=bw();
  ok('and a backdrop bleeds a little past the slide',base>1280&&base<1700,base+'px on a 1280 stage');

  const sl=d.getElementById('fSize');
  ok('the slider reaches 200%',+sl.max===200,sl.max);
  sl.value='200';sl.dispatchEvent(new W.Event('input'));await wait(250);
  ok('dragging it moves the backdrop as you drag',Math.abs(bw()-base*2)<8,
     bw()+' want '+(base*2)+' — it used to set a variable nothing reads');
  sl.dispatchEvent(new W.Event('change'));await wait(400);
  ok('and letting go keeps it',Math.abs(bw()-base*2)<8,bw()+'px');
  ok('which is on the slide, not just on screen',w.figBlocks(w.S.slides[bi2])[0].size===200,
     String(w.figBlocks(w.S.slides[bi2])[0].size));
  ok('an enlarged backdrop crops at the slide edge',
     W.getComputedStyle(stg().querySelector('.bgl')).overflow==='hidden');

  const sl2=d.getElementById('fSize');
  sl2.value='50';sl2.dispatchEvent(new W.Event('input'));await wait(250);
  ok('and it shrinks the same way',Math.abs(bw()-base*0.5)<8,bw()+' want '+(base*0.5));
  sl2.dispatchEvent(new W.Event('change'));await wait(300);

  // the editor and the projector have to agree about it
  w.setFigSize(w.S.slides[bi2],0,100);w.paint();await wait(400);
  const inEditor=bw();
  const html=w.stageHtml(w.S.slides[bi2],false);
  const probe=d.createElement('div');
  probe.className=w.stageClass(w.S.slides[bi2]);
  probe.style.cssText='position:fixed;left:-4000px;top:0;width:1280px;height:720px';
  probe.innerHTML=html;d.body.appendChild(probe);
  await wait(150);
  const sv=probe.querySelector('.bgl svg');
  const asShown=sv?Math.round(sv.getBoundingClientRect().width):0;
  probe.remove();
  ok('the backdrop is the same size in the editor and on the projector',
     Math.abs(asShown-inEditor)<8,inEditor+' vs '+asShown);
  w.S.slides[bi2].layout='text';w.setFigSize(w.S.slides[bi2],0,100);w.paint();await wait(200);

 }catch(e){L.push('ERROR '+e.message+' @ '+(e.stack||'').split('\n')[1]);}
 clearTimeout(__watchdog);
 document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+'</pre>');
});
</script>
