<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui,sans-serif">
  <style>
    @keyframes flow { 0%{opacity:.2;transform:translateX(-6px)} 50%{opacity:1;transform:translateX(0)} 100%{opacity:.2;transform:translateX(6px)} }
    .a1 { animation: flow 6s ease-in-out infinite; }
    .a2 { animation: flow 6s ease-in-out infinite; animation-delay: -3s; }
  </style>
  <rect width="800" height="450" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">The markdown is the deck</text>

  <rect x="44" y="86" width="212" height="200" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
  <text x="150" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">slides/*.md</text>
  <text x="62" y="140" font-size="11" font-family="ui-monospace,monospace" fill="#075985">### 3. `[S]` Title</text>
  <text x="62" y="160" font-size="11" font-family="ui-monospace,monospace" fill="#6B7280">*Summary:* what it is for</text>
  <text x="62" y="180" font-size="11" font-family="ui-monospace,monospace" fill="#6B7280">**Figure:** `fig-x` · split-r</text>
  <text x="62" y="200" font-size="11" font-family="ui-monospace,monospace" fill="#6B7280">*Bestseller:* yes</text>
  <text x="62" y="222" font-size="11" font-family="ui-monospace,monospace" fill="#1E1B4B">&gt; The line that lands.</text>
  <text x="62" y="244" font-size="11" font-family="ui-monospace,monospace" fill="#6B7280">*Delivery note:* say it</text>
  <text x="62" y="266" font-size="11" font-family="ui-monospace,monospace" fill="#6B7280">slowly.</text>

  <path class="a1" d="M262 186 L318 186" stroke="#6B7280" stroke-width="2"/>
  <polygon class="a1" points="330,186 316,180 316,192" fill="#6B7280"/>

  <rect x="336" y="132" width="150" height="108" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="411" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#4C1D95">build_bundle</text>
  <text x="411" y="188" text-anchor="middle" font-size="11.5" fill="#6B7280">one .json</text>
  <text x="411" y="208" text-anchor="middle" font-size="11.5" fill="#6B7280">slides + figures</text>
  <text x="411" y="228" text-anchor="middle" font-size="11.5" fill="#6B7280">+ deck.meta.json</text>

  <path class="a2" d="M492 186 L548 186" stroke="#6B7280" stroke-width="2"/>
  <polygon class="a2" points="560,186 546,180 546,192" fill="#6B7280"/>

  <rect x="566" y="112" width="190" height="46" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="661" y="140" text-anchor="middle" font-size="12.5" fill="#1E1B4B">Edit in the browser</text>
  <rect x="566" y="164" width="190" height="46" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="661" y="192" text-anchor="middle" font-size="12.5" fill="#1E1B4B">Present full screen</text>
  <rect x="566" y="216" width="190" height="46" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="661" y="244" text-anchor="middle" font-size="12.5" fill="#1E1B4B">Print to PDF</text>

  <path d="M661 274 C661 320 411 318 411 300" stroke="#10B981" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <polygon points="411,290 405,304 417,304" fill="#10B981"/>
  <rect x="230" y="316" width="362" height="60" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="411" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">Every edit goes back to the same markdown</text>
  <text x="411" y="362" text-anchor="middle" font-size="11.5" fill="#065F46">Round trip guarded by a test, after it silently ate 3539 words once</text>
  <text x="400" y="428" text-anchor="middle" font-size="12.5" fill="#6B7280">Files stay readable and diffable; the app is a view onto them, never the store.</text>
</svg>
