<!doctype html><meta charset=utf-8><iframe id=f src="/index.html" style="width:1500px;height:940px;border:0"></iframe>
<script>
const E=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const L=[],ok=(n,c,x)=>L.push((c?'PASS ':'FAIL ')+E(n)+(x?'  '+E(x):''));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const spill=()=>{if(!document.getElementById('out'))
  document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+
    '\nERROR the file stopped here — it hung rather than finished</pre>');};
const __watchdog=setTimeout(spill,55000);
const SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">'+
  '<rect width="800" height="450" fill="#FAFAF7"/>'+
  '<style>@keyframes p{to{opacity:1}}</style>'+
  '<text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Drawn</text>'+
  '<text x="400" y="428" text-anchor="middle" font-size="12.5" fill="#6B7280">a takeaway</text></svg>';

addEventListener('load',async()=>{
 const W=f.contentWindow,d=f.contentDocument; await (W.__ready||wait(3500)); await wait(120); const w=W.__api;
 const realFetch=W.fetch;
 let calls=[],replies=[],lag=0;
 // count only calls to the model; the app also PUTs the deck as it saves
 const stub=()=>{const real=W.fetch;W.fetch=async(url,o)=>{
   if(!/generate|completions/.test(String(url)))return real(url,o);
   calls.push(JSON.parse(o.body));
   if(lag)await wait(lag);
   const t=replies.shift();
   if(t===undefined)throw new Error('no canned reply left');
   return {status:200,text:async()=>JSON.stringify({text:t})};};};
 const unstub=()=>{W.fetch=realFetch;};
 try{
  // ---------- what counts as an empty slide ----------
  ok('a slide with nothing on it is blank',w.blankSlide({body:'',notes:'',fig:null}));
  ok('placeholder prose is still blank',w.blankSlide({body:'Say something true.',notes:'',fig:null}),
     'this is what a new slide used to carry');
  ok('real words are not blank',!w.blankSlide({body:'Retrieval and ranking merged in 2021.',notes:''}));
  ok('a figure reference is not blank',!w.blankSlide({body:'![[fig-x]]',notes:''}));
  ok('speaker notes are not blank',!w.blankSlide({body:'',notes:'say this out loud'}));

  // ---------- a new slide arrives empty ----------
  const before=w.S.slides.length;
  w.cur=0;d.getElementById('bNew').click();await wait(150);
  ok('＋ adds a slide',w.S.slides.length===before+1);
  ok('and it is genuinely empty',w.blankSlide(w.S.slides[1]),JSON.stringify(w.S.slides[1].body));
  const NEW=1;

  // ---------- the panel on an empty slide ----------
  w.cur=NEW;w.paint();await wait(150);
  ok('it offers to suggest what goes there',!!d.getElementById('bSugg'));
  ok('and a box to say it yourself',!!d.getElementById('deIn')&&!!d.getElementById('bDesign'));
  ok('with starter chips',d.querySelectorAll('#seeds button').length===w.DESIGN_SEEDS.length);
  ok('Summarise is not offered',!d.getElementById('bSum'));
  ok('nor is Ask AI, which has nothing to act on',!d.getElementById('acts'));

  // ---------- and a written slide can be redesigned from the same box ----------
  const ci0=w.S.slides.findIndex(x=>(x.body||'').trim()&&!/!\[\[/.test(x.body));
  w.cur=ci0;w.paint();await wait(150);
  ok('a written slide gets the box too',!!d.getElementById('deIn'),
     'this is where "make it catchy" used to have nowhere to go');
  ok('and the button says rewrite',/Rewrite it to do this/.test(d.getElementById('bDesign').textContent),
     d.getElementById('bDesign').textContent);
  ok('the tooltip says the author wins',/win/i.test(d.getElementById('bDesign').title));
  calls=[];replies=[JSON.stringify({title:'CATCHY',body:'Something else entirely.',notes:''})];stub();
  d.getElementById('deIn').value='this slide opens the whole deck, make it grab the room';
  d.getElementById('bDesign').click();await wait(500);
  ok('redesigning actually calls the model',calls.length===1,calls.length+' calls');
  ok('and shows it the slide it is rewriting',
     /THE SLIDE AS IT STANDS/.test(calls[0].user||'')
     &&(calls[0].user||'').includes(w.S.slides[ci0].title));
  ok('with the author outranking the house style',
     /THE AUTHOR WINS/.test(calls[0].system||''));
  ok('the instruction is carried through',/grab the room/.test(calls[0].user||''));
  [...d.getElementById('dsOut').querySelectorAll('button')][1].click();  // discard
  unstub();
  w.cur=NEW;w.paint();await wait(150);

  // summarising an empty slide must not reach the model at all
  calls=[];replies=['should never be used'];stub();
  await w.askSummary();await wait(120);
  ok('Summarise refuses an empty slide without calling the model',calls.length===0);
  unstub();

  // ---------- progress reports work, and only claims what is done ----------
  const host=d.getElementById('dsOut');
  const pr=w.progress(host,'drawing something','1 of 2');
  ok('a progress bar appears',!!host.querySelector('.prog i')&&!host.classList.contains('hidden'));
  ok('labelled with the step',/drawing something/.test(host.textContent));
  ok('and how far along it is',/1 of 2/.test(host.textContent));
  const w1=parseFloat(host.querySelector('.prog i').style.width)||0;
  await wait(700);
  const w2=parseFloat(host.querySelector('.prog i').style.width)||0;
  ok('the bar advances while waiting',w2>w1,w1.toFixed(1)+'% → '+w2.toFixed(1)+'%');
  ok('but never reaches the end on its own',w2<100,w2.toFixed(1)+'%');
  pr.fail('it broke');
  ok('failure says so in place',/it broke/.test(host.textContent));
  const pr2=w.progress(host,'x');pr2.done();
  ok('done hides the bar',host.classList.contains('hidden'));

  // ---------- a proposal is shown, never applied behind your back ----------
  let applied=0;
  w.propose(host,'some new body',()=>applied++,'Use this');
  ok('the proposal is visible',/some new body/.test(host.textContent));
  ok('with the verb asked for',/Use this/.test(host.textContent));
  const btns=[...host.querySelectorAll('button')];
  btns[1].click();await wait(40);
  ok('Discard applies nothing',applied===0&&host.classList.contains('hidden'));
  w.propose(host,'some new body',()=>applied++);
  [...host.querySelectorAll('button')][0].click();await wait(40);
  ok('Apply applies once',applied===1);

  // ---------- figures the deck was told about but does not have ----------
  ok('a reference with no drawing is wanted',
     w.wantedFigures({body:'a\n\n![[fig-nope]]\n\nb'}).join()==='fig-nope');
  const have=Object.keys(w.S.figs)[0];
  ok('one it already has is not',w.wantedFigures({body:'![['+have+']]'}).length===0,have);
  ok('a missing hero figure counts too',
     w.wantedFigures({body:'',fig:'fig-hero-nope'}).join()==='fig-hero-nope');

  // ---------- only the deck's own links are offered, and only those survive ----------
  const withLink=w.S.slides.find(x=>/\]\(https?:/.test(x.body||''))||w.S.slides[0];
  withLink.body=(withLink.body||'')+'\n\nSee [arXiv:2004.04906](https://arxiv.org/abs/2004.04906).';
  const ln=w.deckLinks(w.S.slides[NEW]);
  ok('the deck\'s own links are collected',ln.some(x=>x.includes('2004.04906')),ln.length+' links');
  ok('the design brief forbids inventing one',/[Nn]ever invent a URL/.test(w.DESIGN_SYS));

  // ---------- suggestions arrive as editable cards ----------
  w.cur=NEW;w.paint();await wait(120);
  calls=[];replies=[JSON.stringify([
    {title:'Why The Walls Came Down',question:'What actually merged, and when?',
     spec:'· the three systems\n· a figure'},
    {title:'What It Cost',question:'What did the merge cost at serving time?',
     spec:'· latency and serving cost'},
    {title:'Who Paid',question:'Who absorbed the bill?',spec:'· a table of four companies'}])];
  stub();
  d.getElementById('bSugg').click();await wait(400);
  ok('an idea is framed as the question it answers',
     /What actually merged, and when\?/.test(d.getElementById('dsOut').textContent));
  ok('and the prompt asks for moves, not paragraphs',/a MOVE in the talk/.test(calls[0].system||''));
  const cards=d.querySelectorAll('#dsOut .idea');
  ok('three ideas come back',cards.length===3,cards.length+' cards');
  ok('each names itself in an editable field',
     cards[0].querySelector('input.ih')&&cards[0].querySelector('input.ih').value==='Why The Walls Came Down',
     cards[0].querySelector('input.ih')&&cards[0].querySelector('input.ih').value);
  ok('and its specification is editable too',
     !!cards[0].querySelector('textarea.is')&&/three systems/.test(cards[0].querySelector('textarea.is').value));
  ok('the panel says the spec is what gets built',/what gets built/i.test(d.getElementById('dsOut').textContent));
  // edit both, then design
  const ti=cards[0].querySelector('input.ih'),sp=cards[0].querySelector('textarea.is');
  ti.value='A Title I Chose Myself';ti.dispatchEvent(new W.Event('input'));
  sp.value='· exactly what I asked for';sp.dispatchEvent(new W.Event('input'));
  await wait(60);
  ok('the edits are held on the suggestion',
     w.SUGG[0].title==='A Title I Chose Myself'&&/exactly what I asked/.test(w.SUGG[0].spec));

  // ---------- three more ideas must actually be more ----------
  calls=[];replies=[JSON.stringify([
    {title:'A Short History Of Retrieval',question:'How did we get here?',spec:'· a timeline'},
    {title:'What IR Means In 2026',question:'What is IR in 2026?',spec:'· a definition the field argues about'},
    {title:'Where GenAI Actually Sits',question:'Is generative AI used in IR, or only talked about?',
     spec:'· the stack, with the generative box marked'}])];
  d.getElementById('bMore').click();await wait(500);
  ok('a second round asks the model again',calls.length===1,calls.length+' calls');
  ok('and tells it where it has already been',
     /ALREADY PROPOSED/.test(calls[0].user||'')&&/Why The Walls Came Down/.test(calls[0].user||''),
     (calls[0].user||'').slice(-90));
  const titles=()=>[...d.querySelectorAll('#dsOut .idea input.ih')].map(x=>x.value);
  ok('it comes back with different ideas',titles().includes('A Short History Of Retrieval'),
     titles().join(' | '));
  ok('and the old ones are gone',!titles().includes('What It Cost'),titles().join(' | '));
  ok('the question is what the slide answers',
     /Is generative AI used in IR/.test(d.getElementById('dsOut').textContent));
  // and it carries into the brief that builds the slide
  calls=[];replies=[JSON.stringify({title:'x',body:'y',notes:''})];
  d.querySelectorAll('#dsOut .idea')[1].querySelector('button').click();await wait(400);
  ok('the question travels into the brief',
     /It answers: What is IR in 2026\?/.test(calls[0].user||''),
     (calls[0].user||'').slice(-80));
  [...d.getElementById('dsOut').querySelectorAll('button')][1].click();
  unstub();

  // ---------- design a slide end to end, figure and all ----------
  // a fresh round, and edit the card that is on screen now
  w.cur=NEW;w.paint();await wait(150);
  calls=[];replies=[JSON.stringify([
    {title:'Why The Walls Came Down',question:'What actually merged?',spec:'· the three systems'},
    {title:'What It Cost',question:'What did it cost?',spec:'· latency'},
    {title:'Who Paid',question:'Who paid?',spec:'· a table'}])];
  stub();
  d.getElementById('bSugg').click();await wait(500);
  const card=d.querySelector('#dsOut .idea');
  ok('a fresh round of ideas is on screen',!!card);
  const ti2=card.querySelector('input.ih'),sp2=card.querySelector('textarea.is');
  ti2.value='A Title I Chose Myself';ti2.dispatchEvent(new W.Event('input'));
  sp2.value='· exactly what I asked for';sp2.dispatchEvent(new W.Event('input'));
  await wait(60);
  calls=[];replies=[JSON.stringify({
      title:'ignored — the card decided',
      body:'Three systems merged.\n\n![[fig-walls]]\n\n| a | b |\n|---|---|\n| 1 | 2 |\n\n'+
           'See [arXiv:2004.04906](https://arxiv.org/abs/2004.04906) and '+
           '[made up](https://example.com/nope).\n\n> One index, one model.',
      notes:'Say the walls were organisational before they were technical.'}),SVG];
  stub();
  card.querySelector('button').click();
  await wait(500);
  const o1=d.getElementById('dsOut');
  ok('the brief carried the edited spec',/exactly what I asked/.test(calls[0].user||''));
  ok('and the title the card was given',/A Title I Chose Myself/.test(calls[0].system||''));
  ok('the deck\'s links travel with the request',/2004\.04906/.test(calls[0].user||''));
  ok('the draft keeps the table',/\| a \| b \|/.test(o1.textContent));
  ok('and the speaker notes',/organisational before they were technical/.test(o1.textContent));
  ok('a link the deck does not have is dropped',/dropped 1 link/.test(o1.textContent),
     o1.textContent.slice(-120));
  [...o1.querySelectorAll('button')][0].click();
  await wait(1200);
  ok('the card\'s title wins over the model\'s',w.S.slides[NEW].title==='A Title I Chose Myself',
     w.S.slides[NEW].title);
  ok('the table lands on the slide',/\| a \| b \|/.test(w.S.slides[NEW].body));
  ok('the real link survives',/arxiv\.org\/abs\/2004\.04906/.test(w.S.slides[NEW].body));
  ok('the invented one is gone, its words kept',
     !/example\.com/.test(w.S.slides[NEW].body)&&/made up/.test(w.S.slides[NEW].body));
  ok('the notes land too',/organisational/.test(w.S.slides[NEW].notes||''));
  ok('the figure was drawn',!!w.S.figs['fig-walls']);
  unstub();
  w.paint();await wait(150);

  // the rest of this file drives the plain design box
  Object.assign(w.S.slides[NEW],{title:'New slide',body:'',notes:'',fig:null,layout:'text',summary:''});
  delete w.S.figs['fig-walls'];
  w.paint();await wait(150);
  calls=[];replies=[JSON.stringify({title:'Why The Walls Came Down',
    body:'Three systems merged.\n\n![[fig-walls]]\n\n> One index, one model.',notes:''}),SVG];
  stub();
  d.getElementById('deIn').value='how retrieval and ranking merged, with a diagram';
  d.getElementById('bDesign').click();
  await wait(400);
  const out=d.getElementById('dsOut');
  ok('the draft is proposed, not applied',/Why The Walls Came Down/.test(out.textContent)
     &&w.S.slides[NEW].title==='New slide',w.S.slides[NEW].title);
  ok('and it says a figure has to be drawn',/fig-walls/.test(out.textContent));
  [...out.querySelectorAll('button')][0].click();
  await wait(900);
  ok('the title lands on the slide',w.S.slides[NEW].title==='Why The Walls Came Down',w.S.slides[NEW].title);
  ok('so does the body',/Three systems merged/.test(w.S.slides[NEW].body));
  ok('the figure it asked for was actually drawn',!!w.S.figs['fig-walls'],
     Object.keys(w.S.figs).length+' figures now');
  ok('the model was asked twice — slide, then figure',calls.length===2,calls.length+' calls');
  ok('the second call carried the design system',/viewBox exactly/.test(calls[1].system||''));
  ok('the figure was redrawn for the new slide',!!w.S.figs['fig-walls']);
  ok('nothing is left wanting',w.wantedFigures(w.S.slides[NEW]).length===0);
  unstub();
  w.paint();await wait(150);
  ok('and the slide renders it',!!d.querySelector('#sheet .inlinefig svg'));
  ok('with no "not drawn yet" left',!d.querySelector('#sheet .undrawn'));

  // undo takes the drawing back out with the slide
  w.undo();await wait(120);
  ok('undo removes the drawn figure',!w.S.figs['fig-walls']);
  w.undo();await wait(120);
  ok('and then the slide text',w.S.slides[NEW].title==='New slide',w.S.slides[NEW].title);

  // ---------- a reference with no drawing is actionable, not an error ----------
  w.S.slides[NEW].body='![[fig-todo]]';w.paint();await wait(160);
  const un=d.querySelector('#sheet .undrawn');
  ok('an undrawn figure shows as a box, not "missing figure"',!!un
     &&!/missing figure/i.test(d.getElementById('sheet').textContent));
  ok('naming the figure',/fig-todo/.test(un.textContent));
  ok('with three ways out',[...un.querySelectorAll('button')].map(b=>b.dataset.a).join()==='draw,pick,drop');

  calls=[];replies=[SVG];stub();
  [...un.querySelectorAll('button')].find(b=>b.dataset.a==='draw').click();
  await wait(600);
  ok('Draw it draws it',!!w.S.figs['fig-todo']);
  ok('and asked the model for an svg',calls.length===1&&/Draw a NEW figure/.test(calls[0].user||''));
  unstub();

  // ---------- when drawing fails, the reference survives and says so ----------
  delete w.S.figs['fig-todo'];
  w.S.slides[NEW].body='![[fig-todo]]';w.paint();await wait(160);
  calls=[];replies=['sorry, I cannot do that'];stub();
  await w.fulfilFigures(w.S.slides[NEW],'a diagram');
  await wait(200);
  ok('a failed drawing does not invent one',!w.S.figs['fig-todo']);
  ok('the reference is still on the slide',/!\[\[fig-todo\]\]/.test(w.S.slides[NEW].body));
  ok('and the panel says what to do',/Draw it/i.test(d.getElementById('dsOut').textContent),
     d.getElementById('dsOut').textContent.slice(0,60));
  unstub();

  // ---------- Ask AI reports that it is working ----------
  const ci=w.S.slides.findIndex(x=>(x.body||'').trim()&&!/!\[\[/.test(x.body));
  w.cur=ci;w.paint();await wait(150);
  calls=[];replies=['Tighter body.'];lag=300;stub();
  const askBtn=d.getElementById('bAsk');
  d.getElementById('aiIn').value='tighten it';
  askBtn.click();
  await wait(60);
  ok('the Ask button goes busy',askBtn.disabled&&/Working/.test(askBtn.textContent),askBtn.textContent);
  ok('and a bar appears under it',!!d.querySelector('#aiout .prog'));
  await wait(700);lag=0;
  ok('the button comes back',!d.getElementById('bAsk').disabled);
  ok('with the draft proposed',/Tighter body/.test(d.getElementById('aiout').textContent));
  unstub();


  // ---------- a rewrite changes the words, not the arrangement ----------
  const li=w.S.slides.findIndex(x=>x.fig&&w.S.figs[x.fig]&&(x.body||'').trim());
  w.cur=li;w.S.slides[li].layout='split-r';w.paint();await wait(300);
  const st2=()=>d.getElementById('stage');
  ok('the slide is arranged with its figure beside the text',
     !!st2().querySelector('.stack.rev .fg svg'),'split-r');
  calls=[];replies=[JSON.stringify({title:'Rewritten',body:'Different words entirely.',notes:''})];
  stub();
  d.getElementById('deIn').value='say it differently';
  d.getElementById('bDesign').click();await wait(500);
  ok('the model is told which figures the slide already has',
     /FIGURES THIS SLIDE ALREADY HAS/.test(calls[0].user||'')
     &&(calls[0].user||'').includes(w.S.slides[li].fig),
     'so a rewrite cannot drop one');
  [...d.getElementById('dsOut').querySelectorAll('button')][0].click();await wait(900);
  ok('the words change',/Different words entirely/.test(w.S.slides[li].body));
  ok('but the arrangement is left alone',w.S.slides[li].layout==='split-r',
     w.S.slides[li].layout+' — it used to come back as "figure", which does not project the body');
  ok('so the figure is still beside the text',!!st2().querySelector('.stack.rev .fg svg'));
  unstub();
  w.undo();await wait(250);

 }catch(e){L.push('ERROR '+e.message+' @ '+(e.stack||'').split('\n')[1]);}
 unstub();
 clearTimeout(__watchdog);
 document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+'</pre>');
});
</script>
