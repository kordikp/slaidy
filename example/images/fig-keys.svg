<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" font-family="system-ui,sans-serif"><style>.press .cap{animation:press 3s ease-in-out infinite}@keyframes press{0%,70%,100%{transform:translateY(0)}78%,86%{transform:translateY(4px)}}</style><g class="press"><rect x="30" y="19" width="54" height="52" rx="10" fill="#C4BFE8"/><rect class="cap" x="30" y="14" width="54" height="50" rx="10" fill="#FFFFFF" stroke="#4B3FCF" stroke-width="2"/><text class="cap" x="57.0" y="47" text-anchor="middle" font-size="22" font-weight="700" fill="#1E1B4B">→</text></g><text x="106" y="47" font-size="26" fill="#1E1B4B">the next click</text><g><rect x="30" y="87" width="54" height="52" rx="10" fill="#C4BFE8"/><rect class="cap" x="30" y="82" width="54" height="50" rx="10" fill="#FFFFFF" stroke="#4B3FCF" stroke-width="2"/><text class="cap" x="57.0" y="115" text-anchor="middle" font-size="22" font-weight="700" fill="#1E1B4B">←</text></g><text x="106" y="115" font-size="26" fill="#1E1B4B">one click back</text><g><rect x="30" y="155" width="54" height="52" rx="10" fill="#C4BFE8"/><rect class="cap" x="30" y="150" width="54" height="50" rx="10" fill="#FFFFFF" stroke="#4B3FCF" stroke-width="2"/><text class="cap" x="57.0" y="183" text-anchor="middle" font-size="22" font-weight="700" fill="#1E1B4B">O</text></g><text x="106" y="183" font-size="26" fill="#1E1B4B">every slide at once</text><g><rect x="30" y="223" width="72" height="52" rx="10" fill="#C4BFE8"/><rect class="cap" x="30" y="218" width="72" height="50" rx="10" fill="#FFFFFF" stroke="#4B3FCF" stroke-width="2"/><text class="cap" x="66.0" y="251" text-anchor="middle" font-size="17" font-weight="700" fill="#1E1B4B">Esc</text></g><text x="124" y="251" font-size="26" fill="#1E1B4B">back to editing</text><g><rect x="30" y="291" width="54" height="52" rx="10" fill="#C4BFE8"/><rect class="cap" x="30" y="286" width="54" height="50" rx="10" fill="#FFFFFF" stroke="#4B3FCF" stroke-width="2"/><text class="cap" x="57.0" y="319" text-anchor="middle" font-size="22" font-weight="700" fill="#1E1B4B">?</text></g><text x="106" y="319" font-size="26" fill="#1E1B4B">every shortcut there is</text><g><rect x="530" y="19" width="54" height="52" rx="10" fill="#C4BFE8"/><rect class="cap" x="530" y="14" width="54" height="50" rx="10" fill="#FFFFFF" stroke="#4B3FCF" stroke-width="2"/><text class="cap" x="557.0" y="47" text-anchor="middle" font-size="22" font-weight="700" fill="#1E1B4B">P</text></g><text x="606" y="47" font-size="26" fill="#1E1B4B">present, full screen</text><g><rect x="530" y="87" width="54" height="52" rx="10" fill="#C4BFE8"/><rect class="cap" x="530" y="82" width="54" height="50" rx="10" fill="#FFFFFF" stroke="#4B3FCF" stroke-width="2"/><text class="cap" x="557.0" y="115" text-anchor="middle" font-size="22" font-weight="700" fill="#1E1B4B">N</text></g><text x="606" y="115" font-size="26" fill="#1E1B4B">what to say at this click</text><g><rect x="530" y="155" width="54" height="52" rx="10" fill="#C4BFE8"/><rect class="cap" x="530" y="150" width="54" height="50" rx="10" fill="#FFFFFF" stroke="#4B3FCF" stroke-width="2"/><text class="cap" x="557.0" y="183" text-anchor="middle" font-size="22" font-weight="700" fill="#1E1B4B">H</text></g><text x="606" y="183" font-size="26" fill="#1E1B4B">the hidden slides too</text><g><rect x="530" y="223" width="54" height="52" rx="10" fill="#C4BFE8"/><rect class="cap" x="530" y="218" width="54" height="50" rx="10" fill="#FFFFFF" stroke="#4B3FCF" stroke-width="2"/><text class="cap" x="557.0" y="251" text-anchor="middle" font-size="22" font-weight="700" fill="#1E1B4B">D</text></g><text x="606" y="251" font-size="26" fill="#1E1B4B">to the other display</text><g><rect x="530" y="291" width="54" height="52" rx="10" fill="#C4BFE8"/><rect class="cap" x="530" y="286" width="54" height="50" rx="10" fill="#FFFFFF" stroke="#4B3FCF" stroke-width="2"/><text class="cap" x="557.0" y="319" text-anchor="middle" font-size="22" font-weight="700" fill="#1E1B4B">A</text></g><text x="606" y="319" font-size="26" fill="#1E1B4B">pause the clock</text></svg>
