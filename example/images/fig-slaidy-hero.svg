<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui,sans-serif">
  <style>
    @keyframes orbit  { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    @keyframes breathe{ 0%,100%{transform:scale(1);opacity:.9} 50%{transform:scale(1.06);opacity:1} }
    @keyframes dash   { 0%{stroke-dashoffset:220} 100%{stroke-dashoffset:0} }
    @keyframes lift   { 0%,100%{transform:translateY(2px);opacity:.55} 50%{transform:translateY(-2px);opacity:1} }
    @keyframes wipe   { 0%,100%{opacity:.18} 45%,55%{opacity:.85} }
    .ring  { transform-origin:400px 232px; animation: orbit 18s linear infinite; }
    .core  { transform-origin:400px 232px; animation: breathe 6s ease-in-out infinite; }
    .wire  { stroke-dasharray:12 10; animation: dash 6s linear infinite; }
    .wire2 { stroke-dasharray:12 10; animation: dash 6s linear infinite; animation-direction:reverse; }
    .chip1 { transform-origin:center; animation: lift 6s ease-in-out infinite; }
    .chip2 { transform-origin:center; animation: lift 6s ease-in-out infinite; animation-delay:-1.2s; }
    .chip3 { transform-origin:center; animation: lift 6s ease-in-out infinite; animation-delay:-2.4s; }
    .chip4 { transform-origin:center; animation: lift 6s ease-in-out infinite; animation-delay:-3.6s; }
    .glow  { animation: wipe 6s ease-in-out infinite; }
  </style>
  <rect width="800" height="450" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>

  <circle class="glow" cx="400" cy="232" r="150" fill="#EDE9FE"/>
  <g class="ring" fill="none" stroke="#7C3AED" stroke-width="1.2" opacity=".45">
    <circle cx="400" cy="232" r="132" stroke-dasharray="3 9"/>
    <circle cx="532" cy="232" r="4.5" fill="#7C3AED" stroke="none"/>
    <circle cx="268" cy="232" r="3" fill="#0EA5E9" stroke="none"/>
  </g>

  <g class="core">
    <rect x="322" y="188" width="156" height="88" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
    <text x="400" y="228" text-anchor="middle" font-size="27" font-weight="800" fill="#1E1B4B"
          letter-spacing="-.5">Sl<tspan fill="#7C3AED">AI</tspan>dy</text>
    <text x="400" y="252" text-anchor="middle" font-size="11" fill="#6B7280">markdown · svg · one file</text>
  </g>

  <path class="wire"  d="M196 150 H322" stroke="#10B981" stroke-width="2" fill="none"/>
  <path class="wire2" d="M478 150 H604" stroke="#0EA5E9" stroke-width="2" fill="none"/>
  <path class="wire"  d="M196 316 H322" stroke="#D97706" stroke-width="2" fill="none"/>
  <path class="wire2" d="M478 316 H604" stroke="#4C1D95" stroke-width="2" fill="none"/>

  <g class="chip1"><rect x="64" y="128" width="132" height="44" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="130" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="#065F46">you write</text></g>
  <g class="chip2"><rect x="604" y="128" width="132" height="44" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="670" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="#075985">it drafts</text></g>
  <g class="chip3"><rect x="64" y="294" width="132" height="44" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="130" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">you cut</text></g>
  <g class="chip4"><rect x="604" y="294" width="132" height="44" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="670" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95">it draws</text></g>

  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Slides, with the AI in the middle of the word</text>
  <text x="400" y="428" text-anchor="middle" font-size="12.5" fill="#6B7280">Everything on this slide is markdown and SVG — nothing else.</text>
</svg>
