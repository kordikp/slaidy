<!doctype html><meta charset=utf-8><iframe id=f src="/index.html" style="width:1500px;height:940px;border:0"></iframe>
<script>
const E=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const L=[],ok=(n,c,x)=>L.push((c?'PASS ':'FAIL ')+E(n)+(x?'  '+E(x):''));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
addEventListener('load',async()=>{
 const W=f.contentWindow,d=f.contentDocument; await (W.__ready||wait(3500)); await wait(150); const w=W.__api;
 const realFetch=W.fetch;
 try{
  // ---------- what the AI has cost, counted where it is spent ----------
  w.useReset();
  W.fetch=async(u,o)=>{
    if(!/generate|completions/.test(String(u)))return realFetch(u,o);
    await wait(30);
    return {status:200,text:async()=>JSON.stringify({text:'ok',
      usage:{prompt_tokens:120,completion_tokens:40},model:'test-model'})};
  };
  const before=w.useLoad().calls;
  await w.llm('a system prompt','a user prompt',100,'figure');
  await w.llm('another','one more',100,'slide');
  const u=w.useLoad();
  ok('every call is counted',u.calls===before+2,u.calls+' calls');
  ok('with the tokens the endpoint reported',u.inTok===240&&u.outTok===80,
     u.inTok+' in, '+u.outTok+' out');
  ok('and what they were for',u.byKind.figure===1&&u.byKind.slide===1,
     JSON.stringify(u.byKind));
  ok('the model is recorded too',u.byModel['test-model']===2,JSON.stringify(u.byModel));
  ok('and the time waited',u.ms>=50,u.ms+'ms');

  // a failure is a failure, not a call that worked
  W.fetch=async(x,o)=>{
    if(!/generate|completions/.test(String(x)))return realFetch(x,o);
    return {status:500,text:async()=>JSON.stringify({error:'nope'})};
  };
  try{ await w.llm('s','u',10,'edit'); }catch(e){}
  ok('a failure is counted as one',w.useLoad().fails===1,String(w.useLoad().fails));
  ok('and not as a call that worked',w.useLoad().calls===before+2,String(w.useLoad().calls));
  W.fetch=realFetch;

  // ---------- the panel says it plainly ----------
  const html=w.usageHtml();
  ok('the panel reports the calls',/2/.test(html));
  ok('and the tokens, not an estimate of them',/240|Tokens in/.test(html));
  ok('it names what the spending went on',/drawing figures/.test(html),
     Object.keys(w.KIND_LABEL).join(','));
  w.useReset();
  ok('with nothing spent it says so rather than showing zeroes',/Nothing yet/.test(w.usageHtml()),
     w.usageHtml().slice(0,44));
  ok('big numbers read as numbers',w.nfmt(1500)==='1.5k'&&w.nfmt(2400000)==='2.4M',
     w.nfmt(1500)+' '+w.nfmt(2400000));

  // ---------- an endpoint that reports no tokens must not be guessed at ----------
  W.fetch=async(x,o)=>{
    if(!/generate|completions/.test(String(x)))return realFetch(x,o);
    return {status:200,text:async()=>JSON.stringify({text:'ok'})};
  };
  await w.llm('s','u',10,'edit');
  W.fetch=realFetch;
  const u2=w.useLoad();
  ok('a call with no usage reported adds no tokens',u2.inTok===0&&u2.outTok===0,
     u2.inTok+'/'+u2.outTok);
  ok('and the panel says so instead of showing nothing',
     /not reported by this endpoint/.test(w.usageHtml()));

  // ---------- the menu ----------
  const pop=d.getElementById('pop').textContent.replace(/\s+/g,' ');
  ok('the menu offers a new deck',/New deck…/.test(pop),pop.slice(0,90));
  ok('and calls the AI panel by what it shows',/AI usage/.test(pop));
  ok('trim to length is gone from it',!/Trim to length/.test(pop));
  ok('so are copy and paste',!/Copy slides|Paste slides/.test(pop));

  // ---------- a new deck arrives empty and asks where it lives ----------
  const wasTitle=w.S.title;
  await w.newDeck();await wait(500);
  ok('a new deck has one empty slide',w.S.slides.length===1&&!w.S.slides[0].body,
     w.S.slides.length+' slides');
  ok('and is not the one we had',w.S.title!==wasTitle,w.S.title);
  ok('it goes straight to a file when the server holds one',
     !!w.srvDeck?w.fileName===w.srvDeck.path:true,String(w.fileName));

  // ---------- the name, the link, and who paid for the AI ----------
  const logo=d.querySelector('#bar .logo');
  ok('the project is called SlAIdy',logo.textContent.trim()==='SlAIdy',logo.textContent.trim());
  ok('and the name is the way to the source',
     /github\.com\/kordikp\/slaidy/.test(logo.getAttribute('href')),logo.getAttribute('href'));
  ok('opened safely, like every other outbound link',
     /noopener/.test(logo.getAttribute('rel'))&&logo.target==='_blank',logo.getAttribute('rel'));
  ok('the document is titled that too',/SlAIdy/.test(d.title),d.title);

  w.configure();await wait(200);
  const pres=[...d.querySelectorAll('#cPre button')].map(b=>b.textContent);
  ok('the endpoint has presets rather than a URL to remember',pres.length===3,pres.join(' · '));
  ok('CESNET e-INFRA among them',pres.some(x=>/CESNET/.test(x)));
  d.querySelector('#cPre button[data-m="qwen3.5"]').click();await wait(120);
  ok('picking it fills the endpoint',
     /llm\.ai\.e-infra\.cz/.test(d.getElementById('cU').value),d.getElementById('cU').value);
  ok('and the model',d.getElementById('cM').value==='qwen3.5',d.getElementById('cM').value);
  ok('but never a key — a preset cannot hand you someone else\'s',
     !d.getElementById('cK').value,'"'+d.getElementById('cK').value+'"');
  ok('and the panel thanks them',/e-infra\.cz/.test(d.querySelector('.dlg').innerHTML)
     &&/with thanks/.test(d.querySelector('.dlg').textContent));
  d.getElementById('cC').click();await wait(150);


  // renaming the project must not orphan what people already have stored
  ok('the database keeps its old name',
     /indexedDB\.open\('slide-studio'/.test(W.document.documentElement.innerHTML),
     'a storage key is not a brand');

 }catch(e){L.push('ERROR '+E(e.message)+' @ '+E((e.stack||'').split('\n')[1]||''));}
 W.fetch=realFetch;
 document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+'</pre>');
});
</script>
