name: demo

# The whole app is one file, so the demo is the app: index.html with a deck
# beside it. No build, nothing bundled — what is deployed is what is in the repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lay out the site
        run: |
          set -e
          mkdir -p _site
          cp slaidy.html _site/index.html
          cp decks/example.json _site/deck.json
          cp LICENSE _site/LICENSE
          # Every folder under site/ becomes a page of its own carrying the same
          # single file and its own deck — so a talk is a link, and the link
          # presents, reads and exports without anything to install.
          for d in site/*/; do
            [ -f "$d/deck.json" ] || continue
            n=$(basename "$d")
            mkdir -p "_site/$n"
            cp slaidy.html "_site/$n/index.html"
            cp "$d/deck.json" "_site/$n/deck.json"
            # the speaker notes, for a lectern rather than a browser
            if [ -f "$d/notes/index.html" ]; then
              mkdir -p "_site/$n/notes"
              cp "$d/notes/index.html" "_site/$n/notes/index.html"
            fi
            # the commented deck — every slide as it projects, read beside
            if [ -f "$d/commentary/index.html" ]; then
              mkdir -p "_site/$n/commentary" "_site/$n/slides"
              cp "$d/commentary/index.html" "_site/$n/commentary/index.html"
              cp "$d"/slides/*.png "_site/$n/slides/" 2>/dev/null || true
            fi
            echo "  published /$n  ($(du -h "$d/deck.json" | cut -f1))"
          done
          # The theme library: one CSS per theme with its fonts and pictures inside, the
          # list the editor offers (themes/index.json), and each theme's sample deck at
          # /themes/<name>/ — the same single file again, with the sample in that theme.
          python3 scripts/themes.py --out _site/themes
          for d in _site/themes/*/; do cp slaidy.html "$d/index.html"; done
          # The gallery: the published talks and every theme, on one page.
          mkdir -p _site/gallery && cp -r gallery/. _site/gallery/
      - uses: actions/configure-pages@v5
        with: {enablement: true}      # turn Pages on the first time rather than asking
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: deploy
        uses: actions/deploy-pages@v4
