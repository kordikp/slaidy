<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui,sans-serif">
  <style>
    @keyframes shake  { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-2px)} 75%{transform:translateX(2px)} }
    @keyframes apart  { 0%,100%{transform:translate(0,0)} 50%{transform:translate(var(--dx,0),var(--dy,0))} }
    @keyframes fade   { 0%,100%{opacity:.2} 50%{opacity:1} }
    .locked{animation:shake 6s ease-in-out infinite}
    .p1{--dx:-16px;--dy:-10px;animation:apart 6s ease-in-out infinite}
    .p2{--dx:16px;--dy:-8px;animation:apart 6s ease-in-out infinite;animation-delay:-.3s}
    .p3{--dx:-12px;--dy:12px;animation:apart 6s ease-in-out infinite;animation-delay:-.6s}
    .p4{--dx:14px;--dy:12px;animation:apart 6s ease-in-out infinite;animation-delay:-.9s}
    .no{animation:fade 6s ease-in-out infinite}
  </style>
  <rect width="800" height="450" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">A picture you can take apart</text>

  <text x="210" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">a bitmap</text>
  <g class="locked">
    <rect x="120" y="100" width="180" height="140" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <path d="M150 210 L195 155 L230 195 L255 170 L270 210 Z" fill="#EF4444" opacity=".45"/>
    <circle cx="170" cy="135" r="12" fill="#EF4444" opacity=".45"/>
  </g>
  <text class="no" x="210" y="268" text-anchor="middle" font-size="11.5" fill="#991B1B">one flat thing</text>
  <text x="210" y="290" text-anchor="middle" font-size="11.5" fill="#6B7280">no diff, no edit</text>
  <text x="210" y="312" text-anchor="middle" font-size="11.5" fill="#6B7280">redraw it or keep it</text>

  <text x="590" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">an svg</text>
  <rect x="500" y="100" width="180" height="140" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
  <rect class="p1" x="522" y="122" width="62" height="40" rx="6" fill="#0EA5E9" opacity=".8"/>
  <rect class="p2" x="596" y="122" width="62" height="40" rx="6" fill="#7C3AED" opacity=".8"/>
  <rect class="p3" x="522" y="176" width="62" height="40" rx="6" fill="#10B981" opacity=".8"/>
  <rect class="p4" x="596" y="176" width="62" height="40" rx="6" fill="#D97706" opacity=".8"/>
  <text x="590" y="268" text-anchor="middle" font-size="11.5" fill="#075985">parts with names</text>
  <text x="590" y="290" text-anchor="middle" font-size="11.5" fill="#6B7280">move one, recolour one</text>
  <text x="590" y="312" text-anchor="middle" font-size="11.5" fill="#6B7280">ask for one fewer</text>

  <text x="400" y="428" text-anchor="middle" font-size="12.5" fill="#6B7280">3.7 kB the median figure · 180 of them in a one-megabyte deck</text>
</svg>
