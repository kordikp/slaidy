<!doctype html><meta charset=utf-8><body style="margin:0" data-realtime>
<script>
const E=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const L=[],ok=(n,c,x)=>L.push((c?'PASS ':'FAIL ')+E(n)+(x?'  '+E(x):''));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const spill=()=>{if(!document.getElementById('out'))
  document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+
    '\nERROR the file stopped here — it hung rather than finished</pre>');};
const __watchdog=setTimeout(spill,90000);

/* A deck published as a link (a one-file page, meta.shared) is opened, edited,
   and then the publisher rebuilds it — a newer page with the same deck id. The
   edits never left the browser. They must not vanish: closing the tab has to ask
   while they exist, and the newer page has to put them in front of the person
   instead of quietly showing its own copy. (A colleague lost an edit exactly
   this way on GitLab Pages, October 2026.) */
/* the suite runs on virtual time, so a wait does not mean storage has caught up:
   poll what the app wrote instead */
async function stored(W,want){for(let i=0;i<60;i++){
  const ix=await W.__api.get('index:never-vanish');if(ix&&want(ix))return ix;await wait(150);}return null;}
const deck=(title,first)=>({id:'never-vanish',title,meta:{shared:true},style:{},figs:{},
  slides:[{n:1,title:first,body:'one',notes:''},{n:2,title:'Second',body:'two',notes:''}]});
async function page(app,d,modified){
  const tag=`<script id="slaidy-deck" type="application/json" data-modified="${new Date(modified).toUTCString()}">`+
    JSON.stringify(d).replace(/</g,'\\u003c')+'<\/script>';
  const html=app.replace('<title>SlAIdy</title>','<title>'+E(d.title)+'</title>\n'+tag);
  const f=document.createElement('iframe');
  f.style.cssText='width:1000px;height:640px;border:0;position:absolute;left:-9999px;top:0';
  f.src=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  document.body.appendChild(f);
  await new Promise(r=>{f.onload=r;setTimeout(r,9000);});
  const W=f.contentWindow;
  try{await W.__ready;}catch(e){}
  await wait(700);
  return {f,W,D:f.contentDocument};
}

addEventListener('load',async()=>{
 try{
  const app=await (await fetch('/index.html')).text();
  const t0=Date.now()-120000;

  // ---------- the published deck, edited in the browser ----------
  let {f,W,D}=await page(app,deck('Published v1','First'),t0);
  ok('the published deck opens',W.__api.S.title==='Published v1',W.__api.S.title);
  W.__api.S.slides[0].title='MY EDIT';
  W.__api.touch();
  // touch() saves after 800 ms; wait until the save has happened
  for(let i=0;i<60&&!/only in this browser|^saved/.test(D.getElementById('status').textContent);i++)await wait(150);
  await wait(300);
  ok('an edit held only by the browser still counts as unsaved',W.__api.dirty===true);
  ok('and the pill says where it is',/only in this browser/i.test(D.getElementById('status').textContent),
     D.getElementById('status').textContent);
  ok('the browser copy is marked as not saved anywhere',!!(await stored(W,ix=>ix.unsynced===true)));
  ok('and a banner says so once',/only in this browser/i.test((D.getElementById('nudge')||{}).textContent||''),
     (D.getElementById('nudge')||{}).textContent);
  f.remove();

  // ---------- the publisher rebuilds: a newer page, same deck ----------
  ({f,W,D}=await page(app,deck('Published v2','First, rebuilt'),Date.now()+120000));
  for(let i=0;i<80&&!f.contentDocument.getElementById('uKeep');i++)await wait(150);
  D=f.contentDocument;
  const veil=D.getElementById('veil'),dlg=D.getElementById('dlg');
  ok('the newer page does not drop the edits silently: it asks',
     veil.classList.contains('on')&&/Unsaved edits in this browser/.test(dlg.textContent),dlg.textContent.slice(0,80));
  ok('while it shows its own version underneath',W.__api.S.slides[0].title==='First, rebuilt',W.__api.S.slides[0].title);
  D.getElementById('uKeep').click();
  await stored(W,ix=>ix.unsynced===true&&ix.title==='Published v1');
  for(let i=0;i<40&&D.getElementById('veil').classList.contains('on');i++)await wait(100);
  ok('"Continue with my edits" brings them back',W.__api.S.slides[0].title==='MY EDIT',W.__api.S.slides[0].title);
  ok('and they still count as unsaved',W.__api.dirty===true);
  f.remove();

  // ---------- discarding takes a deliberate second click ----------
  ({f,W,D}=await page(app,deck('Published v3','First, rebuilt again'),Date.now()+240000));
  for(let i=0;i<80&&!f.contentDocument.getElementById('uPub');i++)await wait(150);
  D=f.contentDocument;
  ok('the next rebuild asks again — the edits are still not saved anywhere',
     D.getElementById('veil').classList.contains('on'));
  const pub=D.getElementById('uPub');
  pub.click();await wait(200);
  ok('one click on discard only asks to confirm',D.getElementById('veil').classList.contains('on'),pub.textContent);
  pub.click();
  await stored(W,ix=>ix.unsynced===false);
  for(let i=0;i<40&&D.getElementById('veil').classList.contains('on');i++)await wait(100);
  ok('the second click discards and closes',!D.getElementById('veil').classList.contains('on'));
  ok('and the published version stays',W.__api.S.slides[0].title==='First, rebuilt again');
  f.remove();

  ({f,W,D}=await page(app,deck('Published v3','First, rebuilt again'),Date.now()+240000));
  await wait(600);
  ok('after an explicit discard the page opens without asking',!D.getElementById('veil').classList.contains('on'));
  f.remove();
 }catch(e){ ok('no exception',false,e.stack||e.message); }
 clearTimeout(__watchdog);
 document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+'</pre>');
});
</script>
