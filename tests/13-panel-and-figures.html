<!doctype html><meta charset=utf-8><iframe id=f src="/index.html" style="width:1500px;height:940px;border:0"></iframe>
<script>
const E=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const L=[],ok=(n,c,x)=>L.push((c?'PASS ':'FAIL ')+E(n)+(x?'  '+E(x):''));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
addEventListener('load',async()=>{
 const W=f.contentWindow,d=f.contentDocument; await (f.contentWindow.__ready||wait(3500)); await wait(120); const w=W.__api;
 try{
  // ---------- the staged AI panel ----------
  const ei=w.S.slides.findIndex(x=>!x.fig&&!(x.body||'').trim()&&!(x.notes||'').trim());
  ok('fixture has an empty slide',ei>=0,'slide '+(ei+1));
  w.cur=ei;w.paint();await wait(150);
  ok('empty slide offers no Summarise',!d.getElementById('bSum'));
  ok('it offers to suggest what goes there',!!d.getElementById('bSugg'));

  const ni=w.S.slides.findIndex(x=>(x.body||'').trim()&&!(x.summary||'').trim());
  w.cur=ni;w.paint();await wait(150);
  ok('a written slide offers to read itself',!!d.getElementById('bSum'));
  ok('and one box to say what it is for',!!d.getElementById('deIn'));
  ok('with one button that builds it',!!d.getElementById('bDesign')
     &&/Rewrite it to do this/.test(d.getElementById('bDesign').textContent),
     d.getElementById('bDesign').textContent);
  ok('and no second box competing with it',!d.getElementById('fSum')&&!d.getElementById('bMatch'),
     'there used to be two, and nobody could say what the difference was');

  const si=w.S.slides.findIndex(x=>(x.summary||'').trim());
  w.cur=si;w.paint();await wait(150);
  const box=d.getElementById('deIn');
  ok('the box is prefilled with what the slide is for',
     !!box&&box.value===w.S.slides[si].summary,box&&box.value.slice(0,30));
  box.value=box.value+' and then some.';
  box.dispatchEvent(new W.Event('input'));await wait(80);
  ok('typing in it keeps the summary with the slide',
     w.S.slides[si].summary===box.value,w.S.slides[si].summary.slice(-16));
  box.value=w.S.slides[si].summary=box.value.replace(' and then some.','');

  // ---------- tidy every slide moved out of the panel ----------
  ok('the panel tidies only this slide',!!d.querySelector('#side #bTidy')&&!d.querySelector('#side #bTidyAll'));
  ok('the deck-wide one is in the menu',!!d.querySelector('#pop #bTidyAll'));

  // ---------- per-figure size ----------
  const ii=w.S.slides.findIndex(x=>/!\[\[fig-panel-2\|60%\]\]/.test(x.body||''));
  ok('fixture has a sized inline figure',ii>=0,'slide '+(ii+1));
  w.cur=ii;w.paint();await wait(250);
  const figs=[...d.querySelectorAll('#bd .inlinefig')];
  ok('both inline figures render',figs.length===2,figs.length+'');
  const wide=figs[0].querySelector('svg').getBoundingClientRect().width;
  const narrow=figs[1].querySelector('svg').getBoundingClientRect().width;
  ok('the sized one is smaller',narrow<wide*0.75,Math.round(wide)+' vs '+Math.round(narrow));
  ok('the size survives markdown',/!\[\[fig-panel-2\|60%\]\]/.test(w.slideMd(w.S.slides[ii])));
  const rt=w.importMarkdown('x.md','# A\n\n'+w.slideMd(w.S.slides[ii]));
  ok('and comes back',/!\[\[fig-panel-2\|60%\]\]/.test(rt[0].body));
  // the size is pulled from a grip on the picture itself
  const boxes=[...d.querySelectorAll('#bd .inlinefig .figbox')];
  ok('each inline figure carries a grip',boxes.every(b=>b.querySelector('.figgrip')),
     boxes.length+' figures');
  ok('and its own toolbar',boxes.every(b=>b.querySelector('.figbar')));

  // ---------- clicking a figure edits it ----------
  const hi=w.S.slides.findIndex(x=>x.fig&&x.layout!=='text');
  w.cur=hi;w.paint();await wait(250);
  const svg=d.querySelector('#sheet .hero .figbox svg');
  ok('the slide shows its figure',!!svg);
  svg.dispatchEvent(new W.MouseEvent('click',{bubbles:true}));await wait(900);
  ok('clicking it opens the editor, not a picker',!!d.getElementById('fefr')&&
     !d.querySelector('.dlg.wide2'),d.getElementById('fefr')?'editor':'something else');
  d.getElementById('feCancel').click();await wait(150);
  // and the swap button does open the picker
  d.querySelector('.hero .figbox .figbar [data-x="sw"]').click();await wait(250);
  ok('the swap button opens the picker',!!d.querySelector('.dlg.wide2'));
  ok('the picker offers to draw a new one',/Draw a new one/.test(d.querySelector('.dlg').textContent));
  d.getElementById('pfNo').click();await wait(120);

  // ---------- links in the notes ----------
  const li=w.S.slides.findIndex(x=>/https?:\/\//.test(x.notes||''));
  ok('fixture has notes with a link',li>=0,'slide '+(li+1));
  w.cur=li;w.paint();await wait(200);
  const nv=d.getElementById('noteView');
  ok('notes render as text, not a raw box',!!nv&&d.getElementById('fNote').classList.contains('hidden'));
  const as=nv.querySelectorAll('a[href^="https"]');
  ok('and the links are clickable',as.length===2,as.length+' links');
  ok('they open in a new tab',[...as].every(a=>a.target==='_blank'));
  nv.click();await wait(120);
  ok('clicking the text opens the editor',!d.getElementById('fNote').classList.contains('hidden'));
  d.getElementById('fNote').blur();await wait(120);
  ok('and blurring renders it again',!!d.getElementById('noteView').querySelector('a'));
 }catch(e){L.push('ERROR '+e.message+' @ '+(e.stack||'').split('\n')[1]);}
 document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+'</pre>');
});
</script>
