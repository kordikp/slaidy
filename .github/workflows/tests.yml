name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # One script, run here and before pushing, so the two cannot drift apart
      - name: Everything
        run: tests/all.sh
        env:
          CHROME_BIN: chrome
