<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui,sans-serif">
  <style>
    /* Twelve seconds, four beats: you ask, it works, you correct it, it is
       pleased with you. Everything is drawn in its finished state, so with the
       animation off — printing, or a reader who asked for less motion — the
       picture still reads. */
    @keyframes ask    { 0%{opacity:0;transform:translateY(6px) scale(.9)} 6%,26%{opacity:1;transform:none}
                        34%,100%{opacity:0;transform:translateY(6px) scale(.9)} }
    @keyframes hover  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    @keyframes blink  { 0%,46%,52%,100%{transform:scaleY(1)} 48%,50%{transform:scaleY(.12)} }
    @keyframes think  { 0%,22%{opacity:.25} 30%,52%{opacity:1} 60%,100%{opacity:.25} }
    @keyframes place  { 0%,26%{opacity:0;transform:translate(-26px,-14px) scale(.8)}
                        38%,100%{opacity:1;transform:none} }
    @keyframes place2 { 0%,32%{opacity:0;transform:translate(-22px,-10px) scale(.8)}
                        44%,100%{opacity:1;transform:none} }
    @keyframes drawn  { 0%,36%{stroke-dashoffset:190} 56%,100%{stroke-dashoffset:0} }
    @keyframes reach  { 0%,58%{transform:translate(0,0) rotate(0)} 68%,76%{transform:translate(52px,-16px) rotate(-12deg)}
                        88%,100%{transform:translate(0,0) rotate(0)} }
    @keyframes strike { 0%,70%{stroke-dashoffset:64} 80%,100%{stroke-dashoffset:0} }
    @keyframes cheer  { 0%,84%{transform:translateY(0) rotate(0)} 90%{transform:translateY(-9px) rotate(-6deg)}
                        96%,100%{transform:translateY(0) rotate(0)} }
    @keyframes spark  { 0%,86%{opacity:0;transform:scale(.4)} 92%{opacity:1;transform:scale(1)}
                        100%{opacity:0;transform:scale(1.3)} }

    .bubble{transform-origin:150px 120px;animation:ask 12s ease-out infinite}
    .bot   {transform-origin:648px 250px;animation:hover 4s ease-in-out infinite}
    .botC  {transform-origin:648px 250px;animation:cheer 12s ease-out infinite}
    .eye   {transform-origin:center;animation:blink 5s ease-in-out infinite}
    .brain {animation:think 12s ease-in-out infinite}
    .blk1  {transform-origin:center;animation:place 12s cubic-bezier(.2,1.3,.4,1) infinite}
    .blk2  {transform-origin:center;animation:place2 12s cubic-bezier(.2,1.3,.4,1) infinite}
    .art   {stroke-dasharray:190;animation:drawn 12s ease-in-out infinite}
    .arm   {transform-origin:196px 250px;animation:reach 12s ease-in-out infinite}
    .cross {stroke-dasharray:64;animation:strike 12s ease-out infinite}
    .spark {transform-origin:center;animation:spark 12s ease-out infinite}
    @media print,(prefers-reduced-motion:reduce){
      .bubble,.bot,.botC,.eye,.brain,.blk1,.blk2,.art,.arm,.cross,.spark{animation:none!important}
      .bubble{opacity:0} .spark{opacity:0}
    }
  </style>
  <rect width="800" height="450" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">You ask. It makes. You correct it.</text>

  <!-- the slide they are working on -->
  <rect x="272" y="96" width="256" height="248" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="294" y="118" width="140" height="11" rx="5.5" fill="#1E1B4B" opacity=".85"/>
  <g class="blk1"><rect x="294" y="146" width="212" height="8" rx="4" fill="#C9C3F6"/></g>
  <g class="blk2"><rect x="294" y="164" width="150" height="8" rx="4" fill="#C9C3F6"/></g>
  <path class="cross" d="M290 168 H452" stroke="#EF4444" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>
  <g fill="none" stroke="#0EA5E9" stroke-width="2.4" stroke-linecap="round">
    <path class="art" d="M300 224 h54 v38 h-54 z M382 224 h54 v38 h-54 z M354 243 h28 M436 243 h30 v-30"/>
  </g>
  <rect x="294" y="300" width="118" height="8" rx="4" fill="#EDE9FE"/>
  <text x="400" y="330" text-anchor="middle" font-size="10.5" fill="#9AA1AE">slide 12</text>

  <!-- the person -->
  <g>
    <circle cx="150" cy="196" r="30" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
    <circle cx="141" cy="192" r="3" fill="#92400E"/><circle cx="159" cy="192" r="3" fill="#92400E"/>
    <path d="M140 206 q10 8 20 0" fill="none" stroke="#92400E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M110 300 q0 -62 40 -62 q40 0 40 62 z" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
    <g class="arm"><path d="M186 250 q28 8 42 -6" fill="none" stroke="#D97706" stroke-width="6"
       stroke-linecap="round"/><circle cx="230" cy="243" r="7" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/></g>
  </g>
  <text x="150" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">you</text>

  <g class="bubble">
    <path d="M92 96 h116 a10 10 0 0 1 10 10 v30 a10 10 0 0 1 -10 10 h-52 l-14 14 v-14 h-50
             a10 10 0 0 1 -10 -10 v-30 a10 10 0 0 1 10 -10 z" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/>
    <text x="150" y="126" text-anchor="middle" font-size="11.5" fill="#92400E">make this one land</text>
  </g>

  <!-- the little robot -->
  <g class="botC"><g class="bot">
    <path d="M648 178 v-16" stroke="#4C1D95" stroke-width="3" stroke-linecap="round"/>
    <circle class="brain" cx="648" cy="156" r="7" fill="#7C3AED"/>
    <rect x="604" y="178" width="88" height="72" rx="20" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.4"/>
    <rect x="618" y="196" width="60" height="34" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
    <g class="eye"><circle cx="634" cy="213" r="5.5" fill="#4C1D95"/></g>
    <g class="eye"><circle cx="662" cy="213" r="5.5" fill="#4C1D95"/></g>
    <path d="M642 226 q6 5 12 0" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    <rect x="616" y="258" width="64" height="52" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.4"/>
    <circle cx="648" cy="284" r="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6"/>
    <path d="M616 276 q-30 4 -44 -18" fill="none" stroke="#7C3AED" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="570" cy="256" r="7" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <path d="M680 272 q26 -2 34 -22" fill="none" stroke="#7C3AED" stroke-width="5.5" stroke-linecap="round"/>
    <g transform="rotate(38 716 246)">
      <rect x="710" y="222" width="11" height="30" rx="3" fill="#0EA5E9"/>
      <path d="M710 252 h11 l-5.5 10 z" fill="#1E1B4B"/>
      <rect x="710" y="216" width="11" height="7" rx="2.5" fill="#075985"/>
    </g>
    <rect x="626" y="310" width="16" height="12" rx="5" fill="#7C3AED"/>
    <rect x="654" y="310" width="16" height="12" rx="5" fill="#7C3AED"/>
    <g class="spark" fill="#D97706">
      <path d="M700 190 l3.5 8 8 3.5 -8 3.5 -3.5 8 -3.5 -8 -8 -3.5 8 -3.5 z"/>
    </g>
  </g></g>
  <text x="648" y="342" text-anchor="middle" font-size="12" font-weight="600" fill="#4C1D95">it</text>

  <text x="400" y="428" text-anchor="middle" font-size="12.5" fill="#6B7280">It drafts and it draws. Nothing lands until you keep it.</text>
</svg>
