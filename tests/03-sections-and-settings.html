<!doctype html><meta charset=utf-8><iframe id=f src="/index.html" style="width:1440px;height:900px;border:0"></iframe>
<script>
const E=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const L=[],ok=(n,c,x)=>L.push((c?'PASS ':'FAIL ')+E(n)+(x?'  '+E(x):''));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const spill=()=>{if(!document.getElementById('out'))
  document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+
    '\nERROR the file stopped here — it hung rather than finished</pre>');};
const __watchdog=setTimeout(spill,55000);
addEventListener('load',async()=>{
 const W=f.contentWindow,d=f.contentDocument; await (f.contentWindow.__ready||wait(3500)); await wait(120); const w=W.__api;
 try{
  ok('deck loaded',w.S.slides.length>30,w.S.slides.length+' slides');
  ok('subsections in the bundle',
     new Set(w.S.slides.map(x=>x.sub).filter(Boolean)).size===5,
     new Set(w.S.slides.map(x=>x.sub).filter(Boolean)).size+' distinct');
  ok('meta in the bundle',w.S.meta&&w.S.meta.event==='Suite',JSON.stringify(w.S.meta||{}).slice(0,40));
  ok('style in the bundle',w.S.style&&w.S.style.titleSize===38);

  // --- nav shows two levels ---
  ok('nav renders subsection headers',d.querySelectorAll('#nav .sub').length===5,
     d.querySelectorAll('#nav .sub').length+' sub headers');
  ok('nav still renders acts',d.querySelectorAll('#nav .grp').length===4,
     d.querySelectorAll('#nav .grp').length+' sections');

  // --- header carries the path ---
  w.cur=w.S.slides.findIndex(x=>x.sub==='Room 1 — Alpha');w.paint();await wait(150);
  const h=d.querySelector('#sheet .stage .hdr').textContent.replace(/\s+/g,' ').trim();
  ok('header shows section › subsection',/First Section/.test(h)&&/Room 1/.test(h),h);

  // --- renaming a subsection renames it everywhere ---
  const n0=w.S.slides.filter(x=>x.sub==='Room 1 — Alpha').length;
  // renaming happens in the list now, not in a field on the right
  ok('no subsection field in the panel',!d.getElementById('fSub'));
  ok('no tag control either',!d.getElementById('segTag'));
  ok('no config button in the panel',!d.getElementById('bCfg'));
  const hdr=[...d.querySelectorAll('#nav .sub')].find(x=>/Room 1/.test(x.textContent));
  ok('subsection header is in the list',!!hdr,hdr&&hdr.textContent);
  hdr.dispatchEvent(new W.MouseEvent('dblclick',{bubbles:true}));
  await wait(80);
  ok('double-click makes it editable',hdr.contentEditable==='true'&&hdr.classList.contains('editing'));
  hdr.textContent='Room One';
  hdr.dispatchEvent(new W.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
  await wait(150);
  ok('renaming there hits every slide in it',w.S.slides.filter(x=>x.sub==='Room One').length===n0,
     w.S.slides.filter(x=>x.sub==='Room One').length+' of '+n0);
  w.undo();await wait(120);
  ok('undo restores the old name',w.S.slides.filter(x=>x.sub==='Room 1 — Alpha').length===n0);
  // escape abandons the edit
  const h2=[...d.querySelectorAll('#nav .grp')][1];
  const was=h2.textContent;
  h2.dispatchEvent(new W.MouseEvent('dblclick',{bubbles:true}));await wait(60);
  h2.textContent='Nope';
  h2.dispatchEvent(new W.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await wait(100);
  ok('Escape abandons a rename',h2.textContent===was&&!w.S.slides.some(x=>x.group==='Nope'),h2.textContent);

  // --- style applies live ---
  w.S.style.titleSize=50;w.applyStyle();await wait(60);
  const fs=parseFloat(getComputedStyle(d.querySelector('#sheet .stage h2')).fontSize);
  ok('title size drives the board',Math.abs(fs-50)<1.5,fs.toFixed(1)+'px');
  w.S.style.paper='#F0EAD6';w.applyStyle();await wait(60);
  ok('paper colour drives the slide',
     getComputedStyle(d.querySelector('#sheet .stage')).backgroundColor==='rgb(240, 234, 214)');
  w.S.style={};w.applyStyle();await wait(60);
  ok('reset returns to defaults',
     Math.abs(parseFloat(getComputedStyle(d.querySelector('#sheet .stage h2')).fontSize)-38)<1.5);

  // --- header mode ---
  w.S.style.header='none';w.paint();await wait(120);
  ok('header can be turned off',d.querySelector('#sheet .stage .hdr').textContent.trim()==='');
  w.S.style={};w.paint();await wait(120);

  // --- markdown round trip keeps ## ---
  const md=w.slideMd(w.S.slides[8]);
  const back=w.importMarkdown('t.md','# Act I\n\n## Room 1 — Alpha\n\n'+md);
  ok('reimport recovers the subsection',back[0].sub==='Room 1 — Alpha',back[0].sub);
  // ---------- layouts are data ----------
  // The deck holds the shapes a slide can be; the slide names one. That is
  // where a cover, a closing slide and two columns come from without any of
  // them being a special case in the renderer.
  const li=w.S.slides.length-1, sl=w.S.slides[li];
  w.cur=li;
  ok('six built in',Object.keys(w.LAY).length===6,Object.keys(w.LAY).join(' '));
  ok('and they are about shape, not about where one picture goes',
     ['text','two','three','background','cover','closing'].every(k=>w.LAY[k]),
     Object.keys(w.LAY).join(' '));
  ok('the layouts that were about a hero figure are gone',
     !w.LAY.figure&&!w.LAY['split-l']&&!w.LAY['split-r']);

  // areas: how many, and what a separator does
  ok('one area by default',w.LAY.text.areas.length===1);
  ok('two and three say so',w.LAY.two.areas.length===2&&w.LAY.three.areas.length===3);
  const bl=w.blocks('A\n\n<!-- col -->\n\nB\n\n<!-- col -->\n\nC');
  ok('a column break is a block like any other',
     bl.length===5&&bl[1].kind==='col'&&bl[3].kind==='col',bl.map(b=>b.kind).join(','));
  const g2=w.areaGroups(bl,2);
  ok('a layout with two areas takes two groups',g2.length===2,String(g2.length));
  ok('and the surplus carries on in the last, rather than being lost',
     g2[1].filter(b=>b.kind!=='col').map(b=>b.src).join('|')==='B|C',
     g2[1].map(b=>b.src).join('|'));
  ok('a layout with three takes three',w.areaGroups(bl,3).length===3);
  ok('and one with more areas than separators still gets them all',
     w.areaGroups(w.blocks('only this'),3).length===3);

  // rendered
  sl.layout='two';
  sl.body='Left side.\n\n<!-- col -->\n\nRight side.';
  w.paint(); await wait(300);
  const areas=d.querySelectorAll('#sheet .stage .area');
  ok('two areas are drawn',areas.length===2,String(areas.length));
  ok('and they sit side by side',
     areas.length===2&&areas[1].getBoundingClientRect().left>areas[0].getBoundingClientRect().right-2,
     areas.length===2?`${Math.round(areas[0].getBoundingClientRect().right)} then ${Math.round(areas[1].getBoundingClientRect().left)}`:'');
  ok('the text went where the separator put it',
     /Left side/.test(areas[0].textContent)&&/Right side/.test(areas[1].textContent));
  ok('the separator itself is not projected',
     !/col/.test(w.stageHtml(sl,false).replace(/class="[^"]*"/g,'')),'');
  ok('the insert bar offers a column break here',
     !!d.querySelector('#plus button[data-k="col"]'));

  // a cover drops the header and grows the title
  sl.layout='cover'; w.paint(); await wait(250);
  ok('a cover has no header',!d.querySelector('#sheet .stage .hdr'));
  ok('and a bigger title',d.querySelector('#sheet .stage h2').classList.contains('big'));
  sl.layout='text'; w.paint(); await wait(200);
  ok('and an ordinary slide still has one',!!d.querySelector('#sheet .stage .hdr'));
  ok('the insert bar drops the break where it would do nothing',
     !d.querySelector('#plus button[data-k="col"]'));

  // it survives markdown
  sl.layout='two'; sl.body='Left.\n\n<!-- col -->\n\nRight.';
  const lmd=w.slideMd(sl);
  ok('markdown says which layout',/^\*Layout:\* two$/m.test(lmd),(lmd.match(/^\*Layout:.*$/m)||[''])[0]);
  const lback=w.importMarkdown('x.md','# G\n\n'+lmd);
  ok('and reading it back gets the shape',lback[0].layout==='two',lback[0].layout);
  ok('with the separator still in the body',/<!-- col -->/.test(lback[0].body));

  // choosing two columns moves the overflow into the second, rather than
  // waiting to be told where to cut
  sl.layout='text';
  sl.body=['#### One','Alpha alpha alpha.','Beta beta beta.','Gamma gamma gamma.',
           'Delta delta delta.','> Epsilon.'].join('\n\n');
  w.paint();await wait(250);
  d.querySelector('#side #segLay button[data-v="two"]').click();await wait(450);
  const bl2=w.blocks(sl.body);
  ok('switching to two columns cuts the body itself',
     bl2.filter(b=>b.kind==='col').length===1,bl2.map(b=>b.kind).join(','));
  ok('and leaves something on each side',
     bl2[0].kind!=='col'&&bl2[bl2.length-1].kind!=='col',bl2.map(b=>b.kind).join(','));
  const drawn=d.querySelectorAll('#sheet .stage .area');
  ok('both columns have something in them',
     drawn.length===2&&drawn[0].querySelector('.bk')&&drawn[1].querySelector('.bk'),
     [...drawn].map(a=>a.querySelectorAll('.bk').length+' blocks').join(' · '));
  const cutAt=bl2.findIndex(b=>b.kind==='col');
  d.querySelector('#side #segLay button[data-v="three"]').click();await wait(450);
  const bl3=w.blocks(sl.body);
  ok('going to three adds the missing cut',bl3.filter(b=>b.kind==='col').length===2,
     bl3.map(b=>b.kind).join(','));
  ok('and keeps the one that was already there',
     bl3.findIndex(b=>b.kind==='col')===cutAt,'was '+cutAt+', now '+bl3.findIndex(b=>b.kind==='col'));

  // every column has a way in, which matters most when it is empty
  sl.layout='three';sl.body='Only this.\n\n<!-- col -->\n\n<!-- col -->';
  w.paint();await wait(300);
  const cs=d.querySelectorAll('#sheet .stage .area');
  ok('an empty column says so and offers a way in',
     cs.length===3&&cs[2].classList.contains('bare')&&cs[2].querySelector('.addhere'),
     [...cs].map(c=>c.className).join(' | '));
  cs[2].querySelector('.addhere').click();await wait(200);
  const ip=d.querySelector('.inspop');
  ok('pressing it opens the block menu',!!ip);
  ip.querySelector('[data-k="quote"]').click();await wait(350);
  const after=w.blocks(sl.body);
  ok('and what you pick lands in that column, after both breaks',
     after[after.length-1].src.indexOf('>')===0&&
     after.filter(b=>b.kind==='col').length===2,after.map(b=>b.src.slice(0,12)).join('|'));
  const cs2=d.querySelectorAll('#sheet .stage .area');
  ok('so the third column now holds it',!!cs2[2].querySelector('.bk'),
     [...cs2].map(c=>c.querySelectorAll('.bk').length).join(','));

  // and a block can be dragged from one column into another
  sl.body='Alpha.\n\nBeta.\n\n<!-- col -->\n\nGamma.\n\n<!-- col -->\n\nDelta.';
  w.paint();await wait(300);
  const bks=d.querySelectorAll('#sheet .stage .bk');
  const alpha=bks[0], gamma=[...bks].find(x=>/Gamma/.test(x.textContent));
  const dtx=new W.DataTransfer();
  alpha.querySelector('.grip').dispatchEvent(new W.MouseEvent('mousedown',{bubbles:true}));
  alpha.dispatchEvent(new W.DragEvent('dragstart',{bubbles:true,dataTransfer:dtx}));
  const rg=gamma.getBoundingClientRect();
  gamma.dispatchEvent(new W.DragEvent('dragover',
    {bubbles:true,cancelable:true,dataTransfer:dtx,clientY:rg.bottom-2}));
  await wait(80);
  gamma.dispatchEvent(new W.DragEvent('drop',
    {bubbles:true,cancelable:true,dataTransfer:dtx,clientY:rg.bottom-2}));
  await wait(350);
  const moved=w.blocks(sl.body).map(b=>b.src);
  const c1=moved.indexOf('<!-- col -->'), c2=moved.lastIndexOf('<!-- col -->');
  const at=moved.indexOf('Alpha.');
  ok('a block dragged into the middle column lands there',at>c1&&at<c2,
     moved.map(x=>x.slice(0,7)).join('|'));

  // a deck can add its own
  w.S.meta.layouts={'wide-left':{label:'Wide left',areas:[{w:62},{w:38}]}};
  ok('a deck layout joins the built-in ones',!!w.LAYS()['wide-left']&&Object.keys(w.LAYS()).length===7);
  sl.layout='wide-left'; w.paint(); await wait(250);
  const wa=d.querySelectorAll('#sheet .stage .area');
  ok('and it is drawn in the proportion it asked for',
     wa.length===2&&wa[0].getBoundingClientRect().width>wa[1].getBoundingClientRect().width*1.4,
     wa.length===2?`${Math.round(wa[0].getBoundingClientRect().width)} vs ${Math.round(wa[1].getBoundingClientRect().width)}`:'');
  delete w.S.meta.layouts; sl.layout='text'; sl.body='Back to normal.'; w.paint(); await wait(150);

  // ---------- sections are a secRun of slides that agree on a name ----------
  // You could rename one and nothing else. Everything about a section is about
  // where its secRun begins and ends, so the operations live on the heading.
  const heads=()=>[...d.querySelectorAll('#nav .grp')];
  const groups=()=>w.S.slides.map(x=>x.group||'');
  const g0=groups();
  const secH=heads()[1];
  ok('the deck has sections to work with',heads().length>=2,heads().length+' headings');
  secH.dispatchEvent(new W.MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:60,clientY:120}));
  await wait(200);
  const menu=d.querySelector('.ctxmenu');
  ok('right-clicking a heading opens a menu',!!menu);
  const items=[...menu.querySelectorAll('button')].map(b=>b.dataset.a);
  ok('with more than renaming in it',items.join(',').includes('up')
     &&items.join(',').includes('merge'),items.join(','));
  /* "start a new one here" would only rename it — the run already starts here */
  ok('and not the one that would only rename it again',!items.includes('new'),items.join(','));

  // move the whole section up
  const secAt=+secH.dataset.i, name=w.S.slides[secAt].group;
  const secRun=w.runOf('group',name,secAt);
  menu.querySelector('[data-a="up"]').click(); await wait(300);
  const gNow=groups();
  ok('moving it up takes every slide in it',
     gNow.indexOf(name)<g0.indexOf(name)&&
     gNow.filter(x=>x===name).length===secRun[1]-secRun[0]+1,
     'was secAt '+g0.indexOf(name)+', gNow secAt '+gNow.indexOf(name));
  w.undo(); await wait(250);
  ok('and one undo puts the order back',groups().join('|')===g0.join('|'));

  // merge it into the one above
  const secH2=heads()[1], secAt2=+secH2.dataset.i, secName2=w.S.slides[secAt2].group, above=w.S.slides[secAt2-1].group;
  const mergeRun=w.runOf('group',secName2,secAt2);
  secH2.dispatchEvent(new W.MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:60,clientY:120}));
  await wait(200);
  d.querySelector('.ctxmenu [data-a="merge"]').click(); await wait(300);
  ok('merging joins that run to the section above',
     w.S.slides.slice(mergeRun[0],mergeRun[1]+1).every(x=>x.group===above),
     w.S.slides[secAt2].group+' — wanted '+above);
  ok('and the heading it had is gone from the list',
     !heads().some(h=>h.textContent===secName2),
     heads().map(h=>h.textContent).join(' | ').slice(0,60));
  w.undo(); await wait(250);
  ok('undo brings the section back',groups().join('|')===g0.join('|'));

  // start a new one secAt a slide
  const startAt=w.S.slides.length-1, wasG=w.S.slides[startAt].group;
  w.newSection('group',startAt); await wait(200);
  d.getElementById('nsName').value='A New Act';
  d.getElementById('nsOk').click(); await wait(300);
  ok('a new section starts where you said',w.S.slides[startAt].group==='A New Act',
     w.S.slides[startAt].group);
  ok('and the slides after it come along',
     w.S.slides.slice(startAt).every(x=>x.group==='A New Act'));
  ok('while the ones before it are untouched',w.S.slides[startAt-1].group!=='A New Act',
     String(w.S.slides[startAt-1].group));
  w.undo(); await wait(250);
  ok('undone',w.S.slides[startAt].group===wasG,String(w.S.slides[startAt].group));

  // ---------- dropped on a heading means into that section ----------
  // It took the group of whatever was above the drop, which secAt a heading is the
  // last slide of the section before — so a slide let go just under a heading
  // joined the act above it.
  const target=heads()[1], want=w.S.slides[+target.dataset.i].group;
  const dragFrom=w.S.slides.length-1, moving=w.S.slides[dragFrom].title;
  const dt2=new W.DataTransfer();
  const rows=[...d.querySelectorAll('#nav .item')];
  rows[rows.length-1].dispatchEvent(new W.DragEvent('dragstart',{bubbles:true,dataTransfer:dt2}));
  target.dispatchEvent(new W.DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:dt2}));
  await wait(350);
  const landed=w.S.slides.find(x=>x.title===moving);
  ok('a slide dropped on a heading joins that section',landed&&landed.group===want,
     (landed&&landed.group)+' — wanted '+want);
  w.undo(); await wait(250);

  // and the same thing dropped on the first slide UNDER that heading, which is
  // the same index and a different intention
  const head2=heads()[1], firstIx=+head2.dataset.i, want2=w.S.slides[firstIx].group;
  const above2=w.S.slides[firstIx-1].group;
  ok('the two sections really are different',want2!==above2,want2+' vs '+above2);
  const rows2=[...d.querySelectorAll('#nav .item')];
  const first=rows2.find(r=>+r.dataset.i===firstIx);
  const moving2=w.S.slides[w.S.slides.length-1].title;
  const dt3=new W.DataTransfer();
  rows2[rows2.length-1].dispatchEvent(new W.DragEvent('dragstart',{bubbles:true,dataTransfer:dt3}));
  const fr=first.getBoundingClientRect();
  first.dispatchEvent(new W.DragEvent('dragover',
    {bubbles:true,cancelable:true,dataTransfer:dt3,clientY:fr.top+2}));
  first.dispatchEvent(new W.DragEvent('drop',
    {bubbles:true,cancelable:true,dataTransfer:dt3,clientY:fr.top+2}));
  await wait(350);
  const landed2=w.S.slides.find(x=>x.title===moving2);
  ok('dropped just under a heading, it joins the section below it',
     landed2&&landed2.group===want2,(landed2&&landed2.group)+' — wanted '+want2);
  w.undo(); await wait(250);

  // starting a section from the slide itself
  const si2=w.S.slides.length-1, wasG2=w.S.slides[si2].group;
  const row=[...d.querySelectorAll('#nav .item')].find(r=>+r.dataset.i===si2);
  row.dispatchEvent(new W.MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:60,clientY:200}));
  await wait(200);
  const sm=d.querySelector('.ctxmenu');
  const smk=[...sm.querySelectorAll('button')].map(b=>b.dataset.a);
  const startsAlready=(w.S.slides[si2].group||'')!==(w.S.slides[si2-1].group||'');
  ok('a slide that does not begin a section can start one',
     startsAlready?smk.includes('rens'):smk.includes('sect'),smk.join());
  if(startsAlready){ w.newSection('group',si2); await wait(250); }
  else { sm.querySelector('[data-a="sect"]').click(); await wait(250); }
  d.getElementById('nsName').value='Begun Here';
  d.getElementById('nsOk').click(); await wait(300);
  ok('and the section begins with that slide',w.S.slides[si2].group==='Begun Here',
     w.S.slides[si2].group);
  ok('while the one before it keeps its own',w.S.slides[si2-1].group===wasG2,
     String(w.S.slides[si2-1].group));
  w.undo(); await wait(250);

 }catch(e){L.push('ERROR '+e.message+' @ '+(e.stack||'').split('\n')[1]);}
 clearTimeout(__watchdog);
 document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+'</pre>');
});
</script>
