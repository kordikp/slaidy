<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui,sans-serif">
  <style>
    @keyframes grab { 0%,100%{transform:translate(0,0)} 50%{transform:translate(14px,-8px)} }
    .drag{animation:grab 6s ease-in-out infinite}
    @keyframes glow { 0%,100%{opacity:.35} 50%{opacity:1} }
    .mark{animation:glow 6s ease-in-out infinite}
  </style>
  <rect width="800" height="450" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">Figures are SVG, so they are editable</text>

  <rect x="52" y="70" width="420" height="256" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="72" y="96" font-size="11.5" font-weight="700" fill="#6B7280">THE DRAWING, IN AN IFRAME</text>

  <g class="drag">
    <rect x="96" y="122" width="150" height="70" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="171" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">one object</text>
    <g class="mark" fill="#FFFFFF" stroke="#4B3FCF" stroke-width="1.5">
      <rect x="91" y="117" width="10" height="10" rx="2"/><rect x="241" y="117" width="10" height="10" rx="2"/>
      <rect x="91" y="187" width="10" height="10" rx="2"/><rect x="241" y="187" width="10" height="10" rx="2"/>
    </g>
  </g>

  <rect x="286" y="122" width="150" height="70" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="361" y="163" text-anchor="middle" font-size="13" fill="#6B7280">another</text>

  <text x="72" y="238" font-size="11.5" fill="#6B7280">click takes the whole object · double-click steps inside</text>
  <text x="72" y="260" font-size="11.5" fill="#6B7280">drag empty space to lasso what you enclose</text>
  <text x="72" y="282" font-size="11.5" fill="#6B7280">handles resize · Ctrl-G groups · Ctrl-E takes one out</text>
  <text x="72" y="304" font-size="11.5" fill="#6B7280">and the AI can be asked about the selected part alone</text>

  <rect x="496" y="70" width="252" height="256" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="516" y="96" font-size="11.5" font-weight="700" fill="#6B7280">WHY AN IFRAME</text>
  <text x="516" y="126" font-size="12" fill="#1E1B4B">A figure carries its own</text>
  <text x="516" y="146" font-size="12" fill="#1E1B4B">&lt;style&gt;. Inlined, those</text>
  <text x="516" y="166" font-size="12" fill="#1E1B4B">rules are global.</text>
  <rect x="516" y="184" width="212" height="58" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="622" y="206" text-anchor="middle" font-size="11.5" fill="#991B1B">.brand { animation: … }</text>
  <text x="622" y="226" text-anchor="middle" font-size="11.5" fill="#991B1B">once flew the toolbar away</text>
  <rect x="516" y="254" width="212" height="52" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="622" y="276" text-anchor="middle" font-size="11.5" fill="#065F46">Inside a frame they cannot</text>
  <text x="622" y="294" text-anchor="middle" font-size="11.5" fill="#065F46">reach the application at all</text>

  <rect x="52" y="344" width="696" height="42" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="400" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#4C1D95">Selection marks are drawn inside the drawing, in its own coordinates, and stripped on save</text>
  <text x="400" y="428" text-anchor="middle" font-size="12.5" fill="#6B7280">An overlay measured in page pixels drifts the moment anything reflows.</text>
</svg>
