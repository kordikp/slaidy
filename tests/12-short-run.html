<!doctype html><meta charset=utf-8><iframe id=f src="/index.html" style="width:1500px;height:940px;border:0"></iframe>
<script>
const L=[],ok=(n,c,x)=>L.push((c?'PASS ':'FAIL ')+n+(x?'  '+x:''));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
addEventListener('load',async()=>{
 const W=f.contentWindow,d=f.contentDocument; await wait(3500); const w=W.__api;
 try{
  ok('a run can be built',(w.S.slides.forEach((x,i)=>x.pick=w.suggestRun(3).take.has(i)),w.runStats().n>3),w.runStats().n+' slides, '+w.clock(w.runStats().secs));
  const perAct={};w.S.slides.filter(s=>s.pick).forEach(s=>perAct[s.group]=(perAct[s.group]||0)+1);
  ok('every section is in it',Object.keys(perAct).length===4,Object.keys(perAct).length+' sections');
  ok('no section is starved',Math.min(...Object.values(perAct))>=1,JSON.stringify(perAct).slice(0,70));
  w.S.slides.forEach(s=>s.pick=false);

  // --- suggest a run ---
  const TARGET=Math.max(2,Math.round(w.S.slides.reduce((a,x)=>a+w.stats(x).secs,0)/60/3));
  const sug=w.suggestRun(TARGET);
  ok('the suggestion fits its budget',sug.t<=TARGET*60,w.clock(sug.t)+' for '+TARGET+' min');
  ok('and it is a real selection',sug.take.size>15&&sug.take.size<w.S.slides.length,
     sug.take.size+' of '+w.S.slides.length);
  ok('it keeps the opening',sug.take.has(0));
  const last=Math.max(...sug.take);
  ok('the run ends in the last section',
     w.S.slides[last].group===w.S.slides[w.S.slides.length-1].group,
     `ends on ${last+1}: ${w.S.slides[last].group}`);

  const acts=new Set([...sug.take].map(i=>w.S.slides[i].group));
  ok('every act is represented',acts.size===4,acts.size+' sections');
  const asides=[...sug.take].filter(i=>w.S.slides[i].tag==='B').length;
  const allAsides=w.S.slides.filter(s=>s.tag==='B').length;
  ok('asides are cut hardest',asides/Math.max(1,allAsides)<sug.take.size/w.S.slides.length,
     `${asides}/${allAsides} asides vs ${sug.take.size}/${w.S.slides.length} overall`);
  const shorter=w.suggestRun(Math.max(1,Math.floor(TARGET/2)));
  ok('a shorter target takes fewer',shorter.take.size<sug.take.size,
     sug.take.size+' → '+shorter.take.size);

  // --- starring ---
  w.togglePick(5);await wait(80);
  ok('starring one works',w.S.slides[5].pick&&w.runStats().n===1);
  ok('the list shows it',!!d.querySelector('#nav .item.picked')&&
     !!d.querySelector('#nav .star.on'));
  ok('it round-trips through markdown',/\*Bestseller:\* yes/.test(w.slideMd(w.S.slides[5])));
  const back=w.importMarkdown('x.md','# A\n\n'+w.slideMd(w.S.slides[5]));
  ok('and comes back',back[0].pick===true);
  ok('and does not leak into the body',!/Bestseller/.test(back[0].body));
  w.undo();await wait(100);
  ok('undo unstars it',!w.S.slides[5].pick);

  // --- presenting the run ---
  w.S.slides.forEach((s,i)=>s.pick=sug.take.has(i));
  const R=[...sug.take].sort((a,b)=>a-b);
  w.cur=R[0];await w.present(true);await wait(300);
  ok('full deck by default',w.runIdx().length===34);
  W.dispatchEvent||0;
  d.dispatchEvent(new W.KeyboardEvent('keydown',{key:'b',bubbles:true}));await wait(200);
  ok('B switches to the short run',w.runOnly&&w.runIdx().length===R.length,w.runIdx().length+'');
  ok('the counter says so',/short run/.test(d.getElementById('count').textContent),
     d.getElementById('count').textContent);
  // step forward: must skip the unstarred
  const before=w.cur;
  d.dispatchEvent(new W.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await wait(150);
  ok('forward lands on the next starred slide',w.S.slides[w.cur].pick&&w.cur>before,
     before+' → '+w.cur);
  const nextStar=R.find(i=>i>before);
  ok('it lands exactly on the next starred one',w.cur===nextStar,before+' → '+w.cur+', expected '+nextStar);
  d.dispatchEvent(new W.KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}));await wait(150);
  ok('back goes back',w.cur===before,String(w.cur));
  d.dispatchEvent(new W.KeyboardEvent('keydown',{key:'End',bubbles:true}));await wait(150);
  ok('End is the last of the run',w.cur===R[R.length-1],String(w.cur));
  d.dispatchEvent(new W.KeyboardEvent('keydown',{key:'b',bubbles:true}));await wait(200);
  ok('B switches back to everything',!w.runOnly&&w.runIdx().length===34);
  await w.present(false);await wait(150);

  // --- overview grid marks them ---
  w.S.slides.forEach((s,i)=>s.pick=sug.take.has(i));
  await w.present(true);await wait(200);
  d.dispatchEvent(new W.KeyboardEvent('keydown',{key:'o',bubbles:true}));await wait(300);
  ok('the grid marks the run',d.querySelectorAll('#grid .gcell.picked').length===R.length,
     d.querySelectorAll('#grid .gcell.picked').length+' of '+R.length);
  await w.present(false);
 }catch(e){L.push('ERROR '+e.message+' @ '+(e.stack||'').split('\n')[1]);}
 document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+'</pre>');
});
</script>
