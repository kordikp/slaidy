<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="system-ui,sans-serif"><image href="asset:img-9014f8dc94c843f4426643d8" x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid meet"/><rect x="1" y="1" width="1598" height="898" rx="6" fill="none" stroke="#D1D5DB" stroke-width="2"/><g data-step="2"><rect x="4" y="42" width="200" height="536" rx="10" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="5"/><rect x="16" y="724" width="638" height="106" rx="14" fill="#1E1B4B" fill-opacity=".95"/><text x="86" y="770" font-size="30" fill="#FFFFFF">Slides by section: drag to reorder,</text><text x="86" y="810" font-size="30" fill="#FFFFFF">Ctrl-C them into another deck</text><circle cx="52" cy="760" r="22" fill="#7C3AED"/><text x="52" y="770" text-anchor="middle" font-size="27" font-weight="800" fill="#FFFFFF">1</text><circle cx="204" cy="42" r="22" fill="#7C3AED" stroke="#FFFFFF" stroke-width="4"/><text x="204" y="51" text-anchor="middle" font-size="25" font-weight="800" fill="#FFFFFF">1</text></g><g data-step="3"><rect x="229" y="59" width="1062" height="597" rx="10" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="5"/><rect x="286" y="166" width="560" height="106" rx="14" fill="#1E1B4B" fill-opacity=".95"/><text x="356" y="212" font-size="30" fill="#FFFFFF">The slide as the room sees it:</text><text x="356" y="252" font-size="30" fill="#FFFFFF">click anywhere and type</text><circle cx="322" cy="202" r="22" fill="#7C3AED"/><text x="322" y="212" text-anchor="middle" font-size="27" font-weight="800" fill="#FFFFFF">2</text><circle cx="229" cy="59" r="22" fill="#7C3AED" stroke="#FFFFFF" stroke-width="4"/><text x="229" y="68" text-anchor="middle" font-size="25" font-weight="800" fill="#FFFFFF">2</text></g><g data-step="4"><rect x="229" y="664" width="410" height="34" rx="10" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="5"/><rect x="650" y="630" width="700" height="106" rx="14" fill="#1E1B4B" fill-opacity=".95"/><text x="720" y="676" font-size="30" fill="#FFFFFF">Insert the next block: a list, a table,</text><text x="720" y="716" font-size="30" fill="#FFFFFF">a formula, code, a figure, a click</text><circle cx="686" cy="666" r="22" fill="#7C3AED"/><text x="686" y="676" text-anchor="middle" font-size="27" font-weight="800" fill="#FFFFFF">3</text><circle cx="229" cy="681" r="22" fill="#7C3AED" stroke="#FFFFFF" stroke-width="4"/><text x="229" y="690" text-anchor="middle" font-size="25" font-weight="800" fill="#FFFFFF">3</text></g><g data-step="5"><rect x="1316" y="40" width="282" height="858" rx="10" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="5"/><rect x="668" y="770" width="654" height="106" rx="14" fill="#1E1B4B" fill-opacity=".95"/><text x="738" y="816" font-size="30" fill="#FFFFFF">Its purpose, its layout, and the AI:</text><text x="738" y="856" font-size="30" fill="#FFFFFF">tighten it, or say what to change</text><circle cx="704" cy="806" r="22" fill="#7C3AED"/><text x="704" y="816" text-anchor="middle" font-size="27" font-weight="800" fill="#FFFFFF">4</text><circle cx="1316" cy="40" r="22" fill="#7C3AED" stroke="#FFFFFF" stroke-width="4"/><text x="1316" y="49" text-anchor="middle" font-size="25" font-weight="800" fill="#FFFFFF">4</text></g><g data-step="6"><rect x="1380" y="3" width="214" height="32" rx="10" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="5"/><rect x="700" y="46" width="576" height="106" rx="14" fill="#1E1B4B" fill-opacity=".95"/><text x="770" y="92" font-size="30" fill="#FFFFFF">⋯ is the deck: settings, theme,</text><text x="770" y="132" font-size="30" fill="#FFFFFF">export. Present starts the show</text><circle cx="736" cy="82" r="22" fill="#7C3AED"/><text x="736" y="92" text-anchor="middle" font-size="27" font-weight="800" fill="#FFFFFF">5</text><circle cx="1380" cy="19" r="22" fill="#7C3AED" stroke="#FFFFFF" stroke-width="4"/><text x="1380" y="28" text-anchor="middle" font-size="25" font-wei