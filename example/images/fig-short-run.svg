<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui,sans-serif">
  <style>
    @keyframes hop { 0%,100%{opacity:.3} 40%,60%{opacity:1} }
    .s1{animation:hop 6s ease-in-out infinite}
    .s2{animation:hop 6s ease-in-out infinite;animation-delay:-1.5s}
    .s3{animation:hop 6s ease-in-out infinite;animation-delay:-3s}
  </style>
  <rect width="800" height="450" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1E1B4B">When you cannot personalise, recommend the popular path</text>

  <text x="60" y="94" font-size="12.5" font-weight="700" fill="#6B7280">THE WHOLE DECK</text>
  <g fill="#E5E7EB">
    <rect x="60" y="106" width="26" height="34" rx="4"/><rect x="92" y="106" width="26" height="34" rx="4"/>
    <rect x="124" y="106" width="26" height="34" rx="4"/><rect x="156" y="106" width="26" height="34" rx="4"/>
    <rect x="188" y="106" width="26" height="34" rx="4"/><rect x="220" y="106" width="26" height="34" rx="4"/>
    <rect x="252" y="106" width="26" height="34" rx="4"/><rect x="284" y="106" width="26" height="34" rx="4"/>
    <rect x="316" y="106" width="26" height="34" rx="4"/><rect x="348" y="106" width="26" height="34" rx="4"/>
    <rect x="380" y="106" width="26" height="34" rx="4"/><rect x="412" y="106" width="26" height="34" rx="4"/>
    <rect x="444" y="106" width="26" height="34" rx="4"/><rect x="476" y="106" width="26" height="34" rx="4"/>
    <rect x="508" y="106" width="26" height="34" rx="4"/><rect x="540" y="106" width="26" height="34" rx="4"/>
    <rect x="572" y="106" width="26" height="34" rx="4"/><rect x="604" y="106" width="26" height="34" rx="4"/>
    <rect x="636" y="106" width="26" height="34" rx="4"/><rect x="668" y="106" width="26" height="34" rx="4"/>
  </g>
  <text x="706" y="130" font-size="12.5" fill="#6B7280">237 · 2 h 25</text>

  <text x="60" y="206" font-size="12.5" font-weight="700" fill="#D97706">THE SHORT RUN</text>
  <g fill="#FEF3C7" stroke="#D97706" stroke-width="1.5">
    <rect class="s1" x="60" y="218" width="26" height="34" rx="4"/>
    <rect x="124" y="218" width="26" height="34" rx="4"/>
    <rect class="s2" x="220" y="218" width="26" height="34" rx="4"/>
    <rect x="316" y="218" width="26" height="34" rx="4"/>
    <rect class="s3" x="412" y="218" width="26" height="34" rx="4"/>
    <rect x="508" y="218" width="26" height="34" rx="4"/>
    <rect x="604" y="218" width="26" height="34" rx="4"/>
    <rect x="668" y="218" width="26" height="34" rx="4"/>
  </g>
  <text x="706" y="242" font-size="12.5" fill="#92400E">80 · 43 min</text>

  <rect x="60" y="286" width="316" height="96" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="80" y="312" font-size="12.5" font-weight="700" fill="#1E1B4B">A slide earns its place by</text>
  <text x="80" y="334" font-size="11.5" fill="#6B7280">opening an act or a subsection</text>
  <text x="80" y="352" font-size="11.5" fill="#6B7280">landing a key line · showing evidence</text>
  <text x="80" y="370" font-size="11.5" fill="#991B1B">asides go first — that is what an aside is</text>

  <rect x="392" y="286" width="348" height="96" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="412" y="312" font-size="12.5" font-weight="700" fill="#4C1D95">Budget shared act by act</text>
  <text x="412" y="334" font-size="11.5" fill="#4C1D95">in proportion to each act's full length</text>
  <text x="412" y="352" font-size="11.5" fill="#6B7280">so the talk keeps its shape —</text>
  <text x="412" y="370" font-size="11.5" fill="#6B7280">greedy over the whole deck starves acts</text>
  <text x="400" y="428" text-anchor="middle" font-size="12.5" fill="#6B7280">Press B while presenting to switch between the run and everything.</text>
</svg>
