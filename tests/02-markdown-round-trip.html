<!doctype html><meta charset=utf-8><iframe id=f src="/index.html" style="width:1440px;height:900px;border:0"></iframe>
<script>
const L=[],ok=(n,c,x)=>L.push((c?'PASS ':'FAIL ')+n+(x?'  '+x:''));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
addEventListener('load',async()=>{
 const W=f.contentWindow,d=f.contentDocument; await (f.contentWindow.__ready||wait(3500)); await wait(120); const w=W.__api;
 try{
  ok('deck loaded',w.S.slides.length>30,w.S.slides.length+' slides');
  const wc=t=>(t||'').split(/\s+/).filter(Boolean).length;
  const words=w.S.slides.reduce((a,x)=>a+wc(x.body)+wc(x.notes),0);
  ok('no paragraphs were eaten by a metadata line',words>500,words+' words on slides and in notes');

  // a metadata line must never swallow the paragraph after it
  const withFig=w.S.slides.find(x=>x.fig&&x.body.trim());
  ok('the text after a Figure line survives',withFig.body.trim().length>20,
     withFig.body.slice(0,44).replace(/\n/g,' '));
  ok('and no metadata leaked into the body',
     !/\*\*Figure:|\*Summary:|\*Delivery note:|\*Bestseller:/.test(withFig.body));
  const rt=w.importMarkdown('x.md','# A\n\n'+w.slideMd(withFig));
  ok('and survives a round trip through the studio',
     rt[0].body.split(/\s+/).length===withFig.body.split(/\s+/).length,
     rt[0].body.split(/\s+/).length+' vs '+withFig.body.split(/\s+/).length);
  ok('layout survives it as well',rt[0].layout===withFig.layout,rt[0].layout);
  ok('summary survives it as well',(rt[0].summary||'')===(withFig.summary||''));

  // --- a figure with nested groups ---
  ok('the nested figure is bundled',!!w.S.figs['fig-marks']);
  ok('it is real vector, not a raster',/#0065BD/.test(w.S.figs['fig-marks']||'')&&
     !/<image/.test(w.S.figs['fig-marks']||''));
  const marky=w.S.slides.findIndex(x=>x.fig==='fig-marks');
  w.cur=marky;w.paint();await wait(250);
  const hero=d.querySelector('#sheet .stage .hero svg');
  ok('it renders on the slide',!!hero);
  ok('both of its groups came through',hero.querySelectorAll(':scope > g').length===2,
     hero.querySelectorAll(':scope > g').length+' groups');
  ok('and it has a real size',hero.getBoundingClientRect().width>100,
     Math.round(hero.getBoundingClientRect().width)+'px');

  // --- two copies of one figure must not share ids ---
  // (the hidden stage Tidy measures in puts a second copy of the same drawing on
  //  the page; url(#…) then resolved to whichever came first and masks broke)
  w.cur=marky;w.paint();await wait(150);
  w.measureStage(w.S.slides[marky]);await wait(60);
  const all=[...d.querySelectorAll('[id]')].map(x=>x.id);
  const dupes=all.filter((x,i)=>all.indexOf(x)!==i);
  ok('no id appears twice in the document',dupes.length===0,dupes.slice(0,4).join(', '));
  const copies=d.querySelectorAll('svg');
  ok('and there really are two copies to clash',copies.length>=2,copies.length+' svg');
  const uses=[...d.querySelectorAll('use')];
  ok('every use still points at something',
     uses.every(u=>{const h=u.getAttribute('href')||u.getAttribute('xlink:href')||'';
       return !h.startsWith('#')||!!d.getElementById(h.slice(1));}),uses.length+' use');
  const masked=[...d.querySelectorAll('[mask]')];
  ok('every mask reference resolves',
     masked.every(m=>{const v=(m.getAttribute('mask')||'').match(/url\(#([^)]+)\)/);
       return !v||!!d.getElementById(v[1]);}),masked.length+' masked');

  // --- the header says where you are ---
  const hi=w.S.slides.findIndex(x=>x.sub);
  w.cur=hi;w.paint();await wait(150);
  const h=d.querySelector('#sheet .stage .hdr').textContent.replace(/\s+/g,' ').trim();
  const wp=w.where(w.S.slides[hi]);
  ok('header shows the section',h.toLowerCase().includes(wp.sec.toLowerCase()),h);
  ok('and the subsection',h.toLowerCase().includes(w.S.slides[hi].sub.toLowerCase()),
     w.S.slides[hi].sub);
  ok('and the position, without a remaining count',
     !/left/.test(h)&&h.includes(wp.n+' / '+wp.total),h);
  ok('position within the section is consistent',wp.at>=1&&wp.at<=wp.of,wp.at+'/'+wp.of);
  ok('remaining count is right',wp.left===w.S.slides.length-hi-1,String(wp.left));

  // --- gap + rule ---
  const ts=w.S.slides.findIndex(x=>x.layout==='text'&&x.body);
  w.cur=ts;w.paint();await wait(120);
  const n0=w.blocks(w.S.slides[ts].body).length;
  w.insertBlock('gap',1); await wait(120);
  ok('gap inserted',w.blocks(w.S.slides[ts].body).length===n0+1);
  ok('gap is a comment in the markdown',/<!-- gap -->/.test(w.S.slides[ts].body));
  ok('gap renders as space, not text',!!d.querySelector('#bd .gap')&&
     !/gap/.test(d.querySelector('#bd').textContent));
  w.insertBlock('rule',2); await wait(120);
  ok('divider renders as a rule',!!d.querySelector('#bd .rule')&&
     !/\*\*\*/.test(d.querySelector('#bd').textContent));

  // --- reload shows the same thing ---
  const md=w.slideMd(w.S.slides[ts]);
  ok('markdown carries them out',/<!-- gap -->/.test(md)&&/\*\*\*/.test(md),
     JSON.stringify(md.slice(md.indexOf('gap')-30,md.indexOf('gap')+40)));
  const kinds=w.blocks(w.S.slides[ts].body).map(b=>b.kind).join(',');
  ok('reparsing gives the same blocks',/gap/.test(kinds)&&/rule/.test(kinds),kinds);

  w.undo();w.undo();
  ok('undo removes them again',!/<!-- gap -->/.test(w.S.slides[ts].body));

  // --- present + print carry them ---
  w.insertBlock('gap',1);await wait(80);
  await w.present(true);await wait(250);
  ok('present mode renders the gap',!!d.querySelector('#deck .tx .gap')||w.S.slides[w.cur].layout!=='text');
  await w.present(false);
 }catch(e){L.push('ERROR '+e.message+' @ '+(e.stack||'').split('\n')[1]);}
 document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+'</pre>');
});
</script>
