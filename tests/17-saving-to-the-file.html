<!doctype html><meta charset=utf-8><iframe id=f src="/index.html" style="width:1400px;height:900px;border:0"></iframe>
<script>
const E=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const L=[],ok=(n,c,x)=>L.push((c?'PASS ':'FAIL ')+E(n)+(x?'  '+E(x):''));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const spill=()=>{if(!document.getElementById('out'))
  document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+
    '\nERROR the file stopped here — it hung rather than finished</pre>');};
const __watchdog=setTimeout(spill,55000);
const disk=async()=>(await fetch('/deck.json?'+Math.random())).json();

addEventListener('load',async()=>{
 const W=f.contentWindow,d=f.contentDocument; await (W.__ready||wait(3500)); await wait(300); const w=W.__api;
 try{
  // ---------- the server owns the deck, and says so ----------
  const info=await (await fetch('/api/deck')).json();
  ok('the server names the deck it is serving',info.path==='real-deck.json',info.path);
  ok('and says it can write it',info.writable===true);
  ok('the app found it',!!w.srvDeck,JSON.stringify(w.srvDeck&&w.srvDeck.path));
  ok('and the status pill names the file',w.fileName===info.path,w.fileName);
  ok('the pill does not claim browser-only',
     !/this browser/i.test(d.getElementById('status').textContent),
     d.getElementById('status').textContent);

  // ---------- what is served is the file, not a copy ----------
  const served=await disk();
  ok('/deck.json is the deck',Array.isArray(served.slides)&&served.slides.length>0,
     served.slides.length+' slides');
  ok('the app loaded that deck',w.S.slides.length===served.slides.length);

  // ---------- an edit reaches the file on disk ----------
  const mark='EDITED '+Math.random().toString(36).slice(2,8);
  w.S.slides[0].title=mark;
  w.touch();                       // what every edit in the app calls
  for(let i=0;i<40&&(w.dirty||/saving/.test(d.getElementById('status').textContent));i++)await wait(150);
  await wait(150);
  const after=await disk();
  ok('an edit lands in the file itself',after.slides[0].title===mark,after.slides[0].title);
  ok('and the app knows it is saved',!w.dirty);
  ok('the pill says saved',/^saved/.test(d.getElementById('status').textContent),
     d.getElementById('status').textContent);

  // ---------- and survives a reload, which is what kept failing ----------
  const again=new Promise(r=>{const g=d.createElement('iframe');
    g.style.cssText='width:1400px;height:900px;border:0';g.src='/index.html?2';
    g.onload=()=>r(g);d.body.appendChild(g);});
  const g=await again; await (g.contentWindow.__ready||wait(3500)); await wait(400);
  ok('a fresh load shows the edit, not the old title',
     g.contentWindow.__api.S.slides[0].title===mark,
     g.contentWindow.__api.S.slides[0].title);
  g.remove();

  // ---------- the server refuses to write something that is not a deck ----------
  const bad=await fetch('/api/deck',{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({slides:[]})});
  ok('an empty deck is refused',bad.status===400,'HTTP '+bad.status);
  const still=await disk();
  ok('and the file is untouched',still.slides[0].title===mark);

  // ---------- a save failure is reported, never swallowed ----------
  const realFetch=W.fetch;
  W.fetch=async(u,o)=>(String(u).includes('api/deck')&&o&&o.method==='PUT')
    ? {ok:false,status:500,json:async()=>({error:'disk on fire'})}
    : realFetch(u,o);
  w.S.slides[0].title='SHOULD NOT LAND';
  await w.persist();
  await wait(200);
  ok('a refused save shows as not saved',/NOT saved/i.test(d.getElementById('status').textContent),
     d.getElementById('status').textContent);
  W.fetch=realFetch;
  const untouched=await disk();
  ok('and nothing was written',untouched.slides[0].title===mark,untouched.slides[0].title);

  // ---------- a file changed underneath is never silently overwritten ----------
  // something else writes the deck: another tab, or a script
  const other=JSON.parse(JSON.stringify(await disk()));
  other.slides[0].title='WRITTEN BY SOMEONE ELSE';
  await fetch('/api/deck',{method:'PUT',headers:{'Content-Type':'application/json'},
                           body:JSON.stringify(other)});
  w.S.slides[0].title='MY VERSION';
  w.srvDeck.mtime=1;                         // what this tab last saw
  await w.persist();await wait(250);
  const kept=await disk();
  ok('a conflicting save is refused, not merged over',
     kept.slides[0].title==='WRITTEN BY SOMEONE ELSE',kept.slides[0].title);
  ok('and the app says so loudly, not just in the pill',
     !!d.getElementById('nudge')&&/nothing was overwritten/i.test(d.getElementById('nudge').textContent),
     (d.getElementById('nudge')||{}).textContent);
  ok('the pill agrees it is not saved',/NOT saved/i.test(d.getElementById('status').textContent));

  // the edit survives a refused save — it is still in hand, and in the browser copy
  ok('a refused save does not discard the edit',w.S.slides[0].title==='MY VERSION');

  // ---------- version history says what each snapshot would bring back ----------
  const older=JSON.parse(JSON.stringify(w.S));
  older.figs=Object.assign({},w.S.figs);
  const fk=Object.keys(older.figs)[0];
  older.figs[fk]=older.figs[fk]+'<!--edited-->';
  older.slides[1].title='an older title';
  const dd=w.snapDiff(older);
  ok('the diff names the changed figure',dd.includes(fk),dd);
  ok('and counts the differing titles',/title/.test(dd),dd);
  ok('an identical snapshot says so',/identical/.test(w.snapDiff(JSON.parse(JSON.stringify(w.S)))));

  // put it back
  w.srvDeck.mtime=(await (await fetch('/api/deck')).json()).mtime;
  w.S.slides[0].title=served.slides[0].title;await w.persist();await wait(250);
  ok('restored',(await disk()).slides[0].title===served.slides[0].title);
 }catch(e){L.push('ERROR '+e.message+' @ '+(e.stack||'').split('\n')[1]);}
 clearTimeout(__watchdog);
 document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+'</pre>');
});
</script>
