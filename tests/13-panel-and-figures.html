<!doctype html><meta charset=utf-8><iframe id=f src="/index.html" style="width:1500px;height:940px;border:0"></iframe>
<script>
const E=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const L=[],ok=(n,c,x)=>L.push((c?'PASS ':'FAIL ')+E(n)+(x?'  '+E(x):''));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const spill=()=>{if(!document.getElementById('out'))
  document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+
    '\nERROR the file stopped here — it hung rather than finished</pre>');};
const __watchdog=setTimeout(spill,55000);
addEventListener('load',async()=>{
 const W=f.contentWindow,d=f.contentDocument; await (f.contentWindow.__ready||wait(3500)); await wait(120); const w=W.__api;
 try{
  // ---------- the staged AI panel ----------
  const ei=w.S.slides.findIndex(x=>!(x.body||'').trim()&&!(x.notes||'').trim());
  ok('fixture has an empty slide',ei>=0,'slide '+(ei+1));
  w.cur=ei;w.paint();await wait(150);
  ok('empty slide offers no Summarise',!d.getElementById('bSum'));
  ok('it offers to suggest what goes there',!!d.getElementById('bSugg'));

  const ni=w.S.slides.findIndex(x=>(x.body||'').trim()&&!(x.summary||'').trim());
  w.cur=ni;w.paint();await wait(150);
  ok('a written slide offers to read itself',!!d.getElementById('bSum'));
  ok('and one box to say what it is for',!!d.getElementById('deIn'));
  ok('with one button that builds it',!!d.getElementById('bDesign')
     &&/Rewrite it to do this/.test(d.getElementById('bDesign').textContent),
     d.getElementById('bDesign').textContent);
  ok('and no second box competing with it',!d.getElementById('fSum')&&!d.getElementById('bMatch'),
     'there used to be two, and nobody could say what the difference was');

  const si=w.S.slides.findIndex(x=>(x.summary||'').trim());
  w.cur=si;w.paint();await wait(150);
  const box=d.getElementById('deIn');
  ok('the box is prefilled with what the slide is for',
     !!box&&box.value===w.S.slides[si].summary,box&&box.value.slice(0,30));
  box.value=box.value+' and then some.';
  box.dispatchEvent(new W.Event('input'));await wait(80);
  ok('typing in it keeps the summary with the slide',
     w.S.slides[si].summary===box.value,w.S.slides[si].summary.slice(-16));
  box.value=w.S.slides[si].summary=box.value.replace(' and then some.','');

  // ---------- tidy every slide moved out of the panel ----------
  ok('the panel tidies only this slide',!!d.querySelector('#side #bTidy')&&!d.querySelector('#side #bTidyAll'));
  ok('the deck-wide one is in the menu',!!d.querySelector('#pop #bTidyAll'));

  // ---------- per-figure size ----------
  const ii=w.S.slides.findIndex(x=>/!\[\[fig-panel-2\|60%\]\]/.test(x.body||''));
  ok('fixture has a sized inline figure',ii>=0,'slide '+(ii+1));
  w.cur=ii;w.paint();await wait(250);
  const figs=[...d.querySelectorAll('#bd .inlinefig')];
  ok('both inline figures render',figs.length===2,figs.length+'');
  const wide=figs[0].querySelector('svg').getBoundingClientRect().width;
  const narrow=figs[1].querySelector('svg').getBoundingClientRect().width;
  ok('the sized one is smaller',narrow<wide*0.75,Math.round(wide)+' vs '+Math.round(narrow));
  ok('the size survives markdown',/!\[\[fig-panel-2\|60%\]\]/.test(w.slideMd(w.S.slides[ii])));
  const rt=w.importMarkdown('x.md','# A\n\n'+w.slideMd(w.S.slides[ii]));
  ok('and comes back',/!\[\[fig-panel-2\|60%\]\]/.test(rt[0].body));
  // the size is pulled from a grip on the picture itself
  const boxes=[...d.querySelectorAll('#bd .inlinefig .figbox')];
  ok('each inline figure carries a grip',boxes.every(b=>b.querySelector('.figgrip')),
     boxes.length+' figures');
  ok('and its own toolbar',boxes.every(b=>b.querySelector('.figbar')));

  // ---------- clicking a figure edits it ----------
  const hi=w.S.slides.findIndex(x=>w.firstFig(x)&&w.S.figs[w.firstFig(x)]);
  w.cur=hi;w.paint();await wait(250);
  const svg=d.querySelector('#sheet .inlinefig .figbox svg');
  ok('the slide shows its figure',!!svg);
  svg.dispatchEvent(new W.MouseEvent('click',{bubbles:true}));await wait(900);
  ok('clicking it opens the editor, not a picker',!!d.getElementById('fefr')&&
     !d.querySelector('.dlg.wide2'),d.getElementById('fefr')?'editor':'something else');
  d.getElementById('feCancel').click();await wait(150);
  // and the swap button does open the picker
  d.querySelector('.inlinefig .figbox .figbar [data-x="sw"]').click();await wait(250);
  ok('the swap button opens the picker',!!d.querySelector('.dlg.wide2'));
  ok('the picker offers to draw a new one',/Draw a new one/.test(d.querySelector('.dlg').textContent));
  d.getElementById('pfNo').click();await wait(120);

  // ---------- links in the notes ----------
  const li=w.S.slides.findIndex(x=>/https?:\/\//.test(x.notes||''));
  ok('fixture has notes with a link',li>=0,'slide '+(li+1));
  w.cur=li;w.paint();await wait(200);
  const nv=d.getElementById('noteView');
  ok('notes render as text, not a raw box',!!nv&&d.getElementById('fNote').classList.contains('hidden'));
  const as=nv.querySelectorAll('a[href^="https"]');
  ok('and the links are clickable',as.length===2,as.length+' links');
  ok('they open in a new tab',[...as].every(a=>a.target==='_blank'));
  nv.click();await wait(120);
  ok('clicking the text opens the editor',!d.getElementById('fNote').classList.contains('hidden'));
  d.getElementById('fNote').blur();await wait(120);
  ok('and blurring renders it again',!!d.getElementById('noteView').querySelector('a'));

  // ---------- type size: per slide, and for the whole deck ----------
  const ti=w.S.slides.findIndex(x=>(x.body||'').trim());
  w.cur=ti;w.paint();await wait(200);
  const tz=d.getElementById('tSize');
  ok('the panel can set the text size for this slide',!!tz,
     'it was only ever reachable through the markdown or Tidy');
  ok('it starts at what the slide holds',+tz.value===(w.S.slides[ti].textScale||100),
     tz.value+' vs '+w.S.slides[ti].textScale);
  const stage=d.getElementById('stage');
  const px=()=>parseFloat(W.getComputedStyle(stage.querySelector('.tx')).fontSize);
  const was=px();
  tz.value='70';tz.dispatchEvent(new W.Event('input'));await wait(120);
  ok('dragging it changes the slide as you drag',px()<was*0.8,
     Math.round(was)+'px → '+Math.round(px())+'px');
  tz.dispatchEvent(new W.Event('change'));await wait(250);
  ok('letting go keeps it on the slide',w.S.slides[ti].textScale===70,
     String(w.S.slides[ti].textScale));
  ok('and the markdown carries it',/^\*Text:\* 70%/m.test(w.slideMd(w.S.slides[ti])));
  w.undo();await wait(200);
  ok('one undo puts it back',w.S.slides[ti].textScale===(was===px()?100:w.S.slides[ti].textScale),
     String(w.S.slides[ti].textScale));

  // the deck-wide sizes live in Deck settings
  w.deckSettings();await wait(200);
  const body=d.querySelector('.dlg [data-s="bodySize"]'),
        title=d.querySelector('.dlg [data-s="titleSize"]');
  ok('the deck has one body size for everything',!!body,body&&body.value+'px');
  ok('and one title size',!!title,title&&title.value+'px');
  const before=parseFloat(W.getComputedStyle(d.documentElement).getPropertyValue('--d-body'));
  body.value=String(Math.min(26,before+4));body.dispatchEvent(new W.Event('input'));await wait(200);
  const after=parseFloat(W.getComputedStyle(d.documentElement).getPropertyValue('--d-body'));
  ok('changing it moves every slide at once',after>before,before+'px → '+after+'px');
  ok('and it is kept on the deck, not in the browser',w.S.style.bodySize===after,
     String(w.S.style.bodySize));
  body.value=String(before);body.dispatchEvent(new W.Event('input'));await wait(150);
  d.getElementById('dsOk').click();await wait(150);


  // ---------- a slide keeps only what it disagrees with ----------
  const si2=0;w.cur=si2;w.paint();await wait(200);
  const s2=w.S.slides[si2];
  delete s2.style;w.paint();await wait(150);
  ok('a slide with nothing of its own says so',
     /Style just this slide/.test(d.getElementById('bSlideStyle').textContent),
     d.getElementById('bSlideStyle').textContent);
  ok('and inherits the deck',w.sstyle(s2,'titleSize')===w.style('titleSize'),
     String(w.sstyle(s2,'titleSize')));
  ok('so it carries no style vars',w.styleVars(s2)==='');

  w.slideStyle(si2);await wait(200);
  const ts=d.querySelector('.dlg [data-s="titleSize"]');
  ok('the dialog offers a title size for this slide alone',!!ts,ts&&ts.value);
  ts.value=String(+ts.value-8);ts.dispatchEvent(new W.Event('input'));await wait(250);
  ok('setting one stores just that key',
     Object.keys(w.S.slides[si2].style).join()==='titleSize',
     JSON.stringify(w.S.slides[si2].style));
  ok('the stage carries it as a variable',
     /--d-title/.test(w.styleVars(w.S.slides[si2])),w.styleVars(w.S.slides[si2]));
  const h2=d.getElementById('stage').querySelector('h2');
  ok('and the slide is drawn with it',
     Math.round(parseFloat(W.getComputedStyle(h2).fontSize))===+ts.value,
     W.getComputedStyle(h2).fontSize+' want '+ts.value+'px');
  ok('the panel button says it has departed',
     /Styled apart from the deck/.test(d.getElementById('bSlideStyle').textContent),
     d.getElementById('bSlideStyle').textContent);

  // it survives the markdown, and only what differs is written
  const md2=w.slideMd(w.S.slides[si2]);
  ok('the markdown carries the override',/^\*Style:\* titleSize=/m.test(md2),
     (md2.match(/^\*Style:\*.*$/m)||[''])[0]);
  ok('and nothing it did not set',!/accent|paper|ink/.test((md2.match(/^\*Style:\*.*$/m)||[''])[0]));
  const back2=w.importMarkdown('x.md','# G\n\n'+md2);
  ok('reading it back recovers it',
     back2[0].style&&back2[0].style.titleSize===+ts.value,JSON.stringify(back2[0].style));
  ok('and nothing else',Object.keys(back2[0].style||{}).join()==='titleSize');

  w.slideStyle(si2);await wait(200);
  d.querySelector('.dlg [data-clear="titleSize"]').click();await wait(250);
  ok('one click gives it back to the deck',!w.S.slides[si2].style||!w.S.slides[si2].style.titleSize,
     JSON.stringify(w.S.slides[si2].style||{}));
  d.getElementById('ssOk')?.click();await wait(150);
  w.normalise();
  ok('and an empty override is dropped, not left as {}',!w.S.slides[si2].style,
     JSON.stringify(w.S.slides[si2].style));

  // ---------- a figure keeps its motion once it is scoped ----------
  // The rules inside a figure are global until they are prefixed, and the
  // prefixer used to read a comment sitting in front of @keyframes as the head
  // of a selector: the block was cut at the first } inside it and every rule
  // after that came out of step. The drawing survived; all of its motion died.
  const moving=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60"><style>
    /* a comment, exactly where it reads best */
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .bob{animation:bob 2s infinite} .dot{fill:#6366F1}
  </style><circle class="bob dot" cx="50" cy="30" r="8"/></svg>`;
  const scoped=w.scopeSvg(moving,'u9');
  ok('the keyframes are renamed for this copy',/@keyframes bob__u9/.test(scoped));
  ok('and the animation points at the renamed ones',/animation:\s*bob__u9/.test(scoped));
  ok('the class rule is scoped to this figure',/#u9 \.bob/.test(scoped));

  w.S.figs['fig-moving']=moving;
  w.S.slides[0].body='![[fig-moving]]';w.cur=0;w.paint();await wait(400);
  const dot=d.querySelector('#sheet .inlinefig svg circle.bob');
  ok('it draws',!!dot);
  const an=dot?W.getComputedStyle(dot).animationName:'';
  ok('and it actually animates on the slide',/^bob__/.test(an),an||'(none)');
  ok('while its colour rule stays inside the figure',
     W.getComputedStyle(d.getElementById('sheet')).fill!=='rgb(99, 102, 241)');

 }catch(e){L.push('ERROR '+e.message+' @ '+(e.stack||'').split('\n')[1]);}
 clearTimeout(__watchdog);
 document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+'</pre>');
});
</script>
