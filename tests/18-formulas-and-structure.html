<!doctype html><meta charset=utf-8><iframe id=f src="/index.html" style="width:1500px;height:940px;border:0"></iframe>
<script>
const E=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const L=[],ok=(n,c,x)=>L.push((c?'PASS ':'FAIL ')+E(n)+(x?'  '+E(x):''));
/* Cut by characters, not by code units. Half of a surrogate pair reaching the
   DOM crashes the renderer outright — measured — and a file that dies there
   reports nothing at all rather than one bad line. Maths carries astral
   characters now: 𝐞 is one. */
const CUT=(s,n)=>[...String(s)].slice(0,n).join('');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const spill=()=>{if(!document.getElementById('out'))
  document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+
    '\nERROR the file stopped here — it hung rather than finished</pre>');};
const __watchdog=setTimeout(spill,55000);
addEventListener('load',async()=>{
 const W=f.contentWindow,d=f.contentDocument; await (W.__ready||wait(3500)); await wait(150); const w=W.__api;
 try{
  // ---------- TeX in, MathML out ----------
  const m=x=>w.tex2mml(x,false);
  ok('a subscript becomes msub',/<msub><mi>e<\/mi><mi>q<\/mi><\/msub>/.test(m('e_q')),m('e_q'));
  ok('a superscript becomes msup',/<msup>/.test(m('x^2')));
  ok('both at once become msubsup',/<msubsup>/.test(m('x_i^2')));
  ok('a fraction becomes mfrac',/<mfrac>/.test(m('\\frac{a}{b}')));
  const half=document.createElement('div');half.innerHTML=m('\\hat y=w^\\top h=-0.1,\\qquad L=\\frac12(\\hat y-y)^2=0.245');
  const fraction=half.querySelector('mfrac');
  ok('unbraced half has numerator 1 and denominator 2',fraction?.children[0]?.textContent==='1'&&fraction?.children[1]?.textContent==='2',half.innerHTML);
  ok('the following parenthesis stays outside the fraction',fraction?.nextElementSibling?.textContent==='(',half.innerHTML);
  ok('an unbraced numeric exponent consumes one digit',m('x^12').includes('<msup><mi>x</mi><mn>1</mn></msup><mn>2</mn>'),m('x^12'));
  ok('a braced multi-digit exponent remains intact',m('x^{12}').includes('<msup><mi>x</mi><mn>12</mn></msup>'),m('x^{12}'));
  ok('a root becomes msqrt',/<msqrt>/.test(m('\\sqrt{n}')));
  ok('an indexed root becomes mroot',/<mroot>/.test(m('\\sqrt[3]{n}')));
  ok('greek resolves',/α/.test(m('\\alpha')),m('\\alpha'));
  /* mathvariant is a dead letter in a browser — measured, <mi mathvariant=
     "double-struck">R</mi> draws the R that <mi>R</mi> draws — so the variants
     are the characters Unicode has for them. */
  ok('mathbf is the bold character, not an attribute',
     m('\\mathbf{e}').includes('<mi>\u{1D41E}</mi>'),m('\\mathbf{e}'));
  ok('mathbb is the blackboard character',m('\\mathbb{R}').includes('<mi>\u211D</mi>'),m('\\mathbb{R}'));
  ok('mathcal is the script character',m('\\mathcal{L}').includes('<mi>\u2112</mi>'),m('\\mathcal{L}'));
  ok('and what is inside keeps its shape',
     m('\\mathbf{x_i}')==='<math xmlns="http://www.w3.org/1998/Math/MathML"><msub><mi>\u{1D431}</mi><mi>\u{1D422}</mi></msub></math>',
     m('\\mathbf{x_i}'));
  ok('mathrm is upright, which is the one variant a browser still honours',
     /mathvariant="normal">d</.test(m('\\mathrm{d}x')),m('\\mathrm{d}x'));
  ok('a vector gets an accent',/<mover accent="true">/.test(m('\\vec{v}')));
  ok('a sum takes its limits under and over',
     /<munderover><mo class="big">∑<\/mo>/.test(m('\\sum_{i=1}^{n}')),CUT(m('\\sum_{i=1}^{n}'),60));
  ok('argmax is one operator, set with a thin space',
     /<mo class="big">arg\u2009max<\/mo>/.test(m('\\argmax')),
     JSON.stringify(m('\\argmax').match(/>([^<]+)</)[1]));
  ok('a named function stays upright',/mathvariant="normal">log/.test(m('\\log')));
  ok('the deck\'s own formula renders',/<msub><mi>\u{1D41E}<\/mi>/u.test(m('\\mathbf{e}_q')),m('\\mathbf{e}_q'));
  ok('a real scoring function renders whole',
     /<math/.test(m('\\hat{r}_{ui} = \\mathbf{p}_u^\\top \\mathbf{q}_i + b_u'))
     &&!/class="tex"/.test(m('\\hat{r}_{ui} = \\mathbf{p}_u^\\top \\mathbf{q}_i + b_u')));

  // ---------- what it takes, chosen by reading what people write ----------
  // 720 distinct formulas out of a book and two decks. It refused 67 of them;
  // it refuses none now, and these are the ones that were wrong in silence.
  ok('a space inside \\text is the author\'s space',
     m('\\text{if } x>0').includes('<mtext>if&#160;</mtext>'),m('\\text{if } x>0'));
  ok('\\| is the double bar it means',m('\\|x\\|').includes('\u2016'),m('\\|x\\|'));
  ok('\\epsilon and \\varepsilon are two different letters',
     /\u03f5/.test(m('\\epsilon'))&&/\u03b5/.test(m('\\varepsilon')));
  ok('so are \\phi and \\varphi',/\u03d5/.test(m('\\phi'))&&/\u03c6/.test(m('\\varphi')));
  ok('a set is a set',/<mo>\{<\/mo>/.test(m('\\{1,2\\}')),m('\\{1,2\\}'));
  ok('a conditional has its bar',/\u2223/.test(m('P(y \\mid x)')));
  ok('a per cent is a per cent',/<mo>%<\/mo>/.test(m('100\\%')),m('100\\%'));
  ok('a prime is a prime, not an apostrophe',/<mo>\u2032<\/mo>/.test(m("f'(x)")),m("f'(x)"));
  ok('a double prime is two of them',/<mo>\u2032\u2032<\/mo>/.test(m("f''")));
  ok('\\limits does not get between an operator and its limits',
     /<munderover><mo class="big">\u2211<\/mo>/.test(m('\\sum\\limits_{i=1}^n')),
     CUT(m('\\sum\\limits_{i=1}^n'),70));
  ok('a binomial is two rows in a bracket, because linethickness is ignored',
     /<mtable><mtr><mtd><mi>n<\/mi>/.test(m('\\binom{n}{k}')),CUT(m('\\binom{n}{k}'),80));
  ok('\\left and \\right make one row, so the brackets can stretch',
     /^<math[^>]*><mrow><mo>\(<\/mo><mfrac>/.test(m('\\left(\\frac{a}{b}\\right)')),
     CUT(m('\\left(\\frac{a}{b}\\right)'),70));
  ok('\\underbrace takes its label under the brace',
     /<munder class="big">/.test(m('\\underbrace{a+b}_{c}')),CUT(m('\\underbrace{a+b}_{c}'),60));
  ok('\\overset stacks one thing on another',/<mover>/.test(m('\\overset{?}{=}')));
  ok('\\implies is an arrow',/\u27f9/.test(m('\\implies')));
  ok('\\operatorname is a name, upright and whole',
     m('\\operatorname{sim}(u,v)').includes('<mi>sim</mi>'),CUT(m('\\operatorname{sim}(u,v)'),60));

  // environments — the thing a display formula most often is
  const cases_=m('\\begin{cases} a & x>0 \\\\ b & x<0 \\end{cases}');
  ok('cases is a table in a brace',
     /<mrow><mo>\{<\/mo><mtable columnalign="left"><mtr>/.test(cases_),CUT(cases_,70));
  ok('with a row per line',(cases_.match(/<mtr>/g)||[]).length===2,String((cases_.match(/<mtr>/g)||[]).length));
  const mat=m('\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}');
  ok('a matrix is a table in brackets',/<mo>\(<\/mo><mtable>/.test(mat)&&
     (mat.match(/<mtd>/g)||[]).length===4,CUT(mat,70));
  ok('bmatrix uses square brackets',/<mo>\[<\/mo>/.test(m('\\begin{bmatrix} a \\end{bmatrix}')));
  ok('aligned lines up without brackets',
     /^<math[^>]*><mtable columnalign="left">/.test(m('\\begin{aligned} a &= b \\\\ &= c \\end{aligned}')));
  ok('an array eats its column spec rather than printing it',
     !/<mi>c<\/mi><mi>c<\/mi>/.test(m('\\begin{array}{cc} a & b \\end{array}')),
     CUT(m('\\begin{array}{cc} a & b \\end{array}'),70));
  ok('\\substack stacks a limit under a sum',
     /<munder><mo class="big">\u2211<\/mo><mtable>/.test(m('\\sum_{\\substack{i \\\\ j}} x')),
     CUT(m('\\sum_{\\substack{i \\\\ j}} x'),70));
  ok('an environment that was never closed is refused, not guessed at',
     /class="tex"/.test(m('\\begin{pmatrix} a & b')),CUT(m('\\begin{pmatrix} a & b'),50));
  ok('and so is one this does not know',/class="tex"/.test(m('\\begin{nosuchenv} a \\end{nosuchenv}')));
  ok('an & outside an environment is refused',/class="tex"/.test(m('a & b')));

  // the corpus itself: every one of these was written by somebody
  const REAL=['\\hat{y} = \\mathbf{w}^\\top \\mathbf{x} + b',
    'P(y \\mid x) = \\frac{P(x \\mid y)P(y)}{P(x)}',
    '\\mathcal{L} = -\\sum_{i} y_i \\log \\hat{y}_i',
    'A = \\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right)V',
    'X \\in \\mathbb{R}^{n \\times d}',
    '\\text{ILD}(L) = \\frac{1}{|L|(|L|-1)} \\sum_{\\substack{i, j \\in L \\\\ i \\neq j}} d(i, j)',
    '\\mathbf{u}_i^{\\text{new}} = (\\mathbf{V}^T\\mathbf{V} + \\lambda I)^{-1}\\mathbf{V}^T\\mathbf{x}_i',
    '\\text{NDCG@}k = \\frac{\\text{DCG@}k}{\\text{IDCG@}k}',
    '\\sigma(z) = \\frac{1}{1 + e^{-z}}',
    '\\text{vec}(\\text{king}) - \\text{vec}(\\text{man}) \\approx \\text{vec}(\\text{queen})'];
  const refused=REAL.filter(x=>/class="tex"/.test(m(x)));
  ok('ten formulas taken out of the book all render',!refused.length,CUT(refused.join(' | '),90));

  // it refuses honestly rather than mangling
  const bad=m('\\notacommand{x}');
  ok('an unknown command comes back as the TeX you typed',
     /class="tex"/.test(bad)&&/notacommand/.test(bad),CUT(bad,70));
  ok('and says why',/title="[^"]+"/.test(bad));
  ok('unbalanced braces do not throw',/class="tex"/.test(m('\\frac{a')),CUT(m('\\frac{a'),50));

  // ---------- inline maths in a slide ----------
  const html=w.inl('the query embedding $\\mathbf{e}_q$ and $5 < x$');
  ok('inline $…$ renders as maths',(html.match(/<math/g)||[]).length===2,CUT(html,80));
  ok('and its < survives being maths, not markup',/&lt;|<mo>&lt;<\/mo>/.test(html));
  ok('a price is left alone',!/math/.test(w.inl('it costs $5 and $9')),w.inl('it costs $5 and $9'));
  ok('strikethrough works too',/<s>gone<\/s>/.test(w.inl('~~gone~~')));

  // ---------- blocks the editor now understands ----------
  const B=w.blocks;
  ok('#### is a heading, not a paragraph',B('#### A head')[0].kind==='head');
  /* ### used to be left alone because it starts a slide in a file. A slide start
     is a numbered line, so a bare ### is free to be the biggest heading. */
  ok('### is the big heading inside a slide',B('### A big head')[0].kind==='head');
  const cb=B('```python\nx = 1\ny = 2\n```');
  ok('a fenced block is one block',cb.length===1&&cb[0].kind==='code',JSON.stringify(cb.map(x=>x.kind)));
  ok('and keeps its lines',/x = 1\ny = 2/.test(cb[0].src));
  ok('markdown inside a fence is not markdown',
     /\* not a list/.test(B('```\n* not a list\n```')[0].src));
  const mb=B('$$ x^2 $$');
  ok('a display formula on one line is one block',mb.length===1&&mb[0].kind==='math');
  const mb2=B('$$\n\\frac{a}{b}\n$$');
  ok('and across lines too',mb2.length===1&&mb2[0].kind==='math',JSON.stringify(mb2.map(x=>x.kind)));

  // Delimiters must behave the same wherever the author puts an equation.
  const render=md=>{const el=document.createElement('div');el.innerHTML=B(md).map(b=>w.block(b)).join('');return el;};
  for(const md of ['Loss $$x^2$$ follows.','- Loss $$ x^2 $$','> $$x^2$$',
      '| Loss |\n|---|\n| $$ x^2 $$ |','$$x^2$$.\n\nFollowing paragraph.',
      '$$\nx^2\n\n+ y^2\n$$','$$\nx^2\n$$.\n\nFollowing paragraph.']){
    const el=render(md);
    ok('display math without stray dollars: '+JSON.stringify(md),
       el.querySelectorAll('math[display="block"]').length===1&&!el.textContent.includes('$')&&!el.querySelector('.tex'),el.innerHTML);
    if(md.includes('Following'))ok('text after a formula stays outside MathML',
       !el.querySelector('math').textContent.includes('Following')&&el.textContent.includes('Following paragraph.'));
  }
  const pair=render('$$x^2$$ and $$y^2$$');
  ok('two display equations on one line remain separate',pair.querySelectorAll('math').length===2&&!pair.textContent.includes('$'));
  const mixed=render('Inline $x^2$, display $$ y^2 $$, then $z^2$.');
  ok('single and double delimiters do not consume each other',mixed.querySelectorAll('math').length===3&&mixed.querySelectorAll('math[display="block"]').length===1&&!mixed.textContent.includes('$'));
  for(const md of ['`$$x^2$$`','``$$x^2$$``','```tex\n$$x^2$$\n```']){
    const el=render(md);
    ok('math notation inside code stays literal: '+JSON.stringify(md),!el.querySelector('math')&&el.querySelector('code')?.textContent==='$$x^2$$');
  }
  const literal=render('Escaped \\$x\\$; \\$\\$x^2\\$\\$.');
  ok('escaped dollars stay literal',!literal.querySelector('math')&&literal.textContent==='Escaped $x$; $$x^2$$.');
  const unfinished=render('$$\nx^2');
  ok('an unfinished display delimiter stays editable text',!unfinished.querySelector('math')&&unfinished.textContent.includes('$$'));
  const original='Loss $$\\hat y=w^\\top h=-0.1,\\qquad L=\\frac12(\\hat y-y)^2=0.245$$.';
  const originalView=render(original),originalFrac=originalView.querySelector('mfrac');
  ok('the reported loss equation works inside prose too',originalFrac?.children[0]?.textContent==='1'&&originalFrac?.children[1]?.textContent==='2'&&!originalView.textContent.includes('$'));

  ok('a heading renders as a heading',/<h3 class="bh/.test(w.block(B('#### Head')[0])));
  ok('##### is the smaller one',/<h4 class="bh/.test(w.block(B('##### Small')[0])));
  ok('### renders as the largest',/<h2 class="bh h3/.test(w.block(B('### Big')[0])));
  // ---------- ### on a slide, and in the markdown editor ----------
  {
    const s0=w.S.slides[0], keep=s0.body;
    s0.body='### Subtitle on the slide\n\nA line under it.\n\n1. first\n2. second\n3. third';
    w.cur=0;w.paint();await wait(150);
    const h2=d.querySelector('#sheet .stage .tx h2.bh'),h3p=d.querySelector('#sheet .stage .tx p');
    ok('a ### line is drawn as a big subheading',!!h2&&/Subtitle/.test(h2.textContent));
    ok('and it is larger than the body',!!h2&&!!h3p&&parseFloat(getComputedStyle(h2).fontSize)>1.2*parseFloat(getComputedStyle(h3p).fontSize),
       h2&&h3p?getComputedStyle(h2).fontSize+' vs '+getComputedStyle(h3p).fontSize:'missing');
    // the numbered list's markers were cut off at the left edge of the column
    const ol=d.querySelector('#sheet .stage .tx ol'),txin=d.querySelector('#sheet .stage .txin')||d.querySelector('#sheet .stage .tx');
    const fs=ol?parseFloat(getComputedStyle(ol).fontSize):16;
    ok('a numbered list leaves room for its markers',!!ol&&ol.getBoundingClientRect().left-txin.getBoundingClientRect().left>=1.6*fs*(txin.getBoundingClientRect().width/txin.offsetWidth||1)/ (1),
       ol?Math.round(ol.getBoundingClientRect().left-txin.getBoundingClientRect().left)+'px for '+Math.round(fs)+'px type':'no list');
    // the round trip through the file keeps it a heading, not a second slide
    const md=w.slideMd(s0), back=w.mdParse(md,s0);
    ok('exported and read back, a bare ### stays inside the slide',back.length===1&&/^### Subtitle/m.test(back[0].body),
       back.length+' slides · '+(back[0]?CUT(back[0].body,30):''));
    // in the markdown editor a numbered ### starts another slide, a bare one does not
    const two=w.mdParse('### First\n\nOne.\n\n### 2. Second\n\nTwo.',s0);
    ok('"### 2. Title" in the editor splits the slide',two.length===2&&two[1].title==='Second',two.length+' slides');
    const one=w.mdParse('### First\n\nOne.\n\n### A subheading\n\nMore.',s0);
    ok('a bare second ### is a subheading, not a split',one.length===1&&/### A subheading/.test(one[0].body),one.length+' slides');
    s0.body=keep;w.paint();await wait(60);
  }
  ok('code renders as pre',/<pre class="cb"/.test(w.block(cb[0])));
  ok('and names its language',/data-lang="python"/.test(w.block(cb[0])));
  ok('a display formula centres',/mathblock/.test(w.block(mb[0]))&&/display="block"/.test(w.block(mb[0])));

  // ---------- they are offered in the editor ----------
  w.cur=0;w.paint();await wait(200);
  const keys=[...d.querySelectorAll('#plus button')].map(b=>b.dataset.k);
  ['head','math','code'].forEach(k=>
    ok('the insert row offers '+w.SNIP[k].l,keys.includes(k),keys.join(',')));
  ok('every offered block has an icon',
     [...d.querySelectorAll('#plus button svg')].length===keys.length);

  // ---------- round trip: nothing is lost through markdown ----------
  const body='#### Scoring\n\n$$ \\hat{r}_{ui} = \\mathbf{p}_u^\\top \\mathbf{q}_i $$\n\n'+
             '```python\nscore = p @ q.T\n```\n\nInline $\\alpha$ too.';
  w.S.slides[0].body=body;
  const md=w.slideMd(w.S.slides[0]);
  const back=w.importMarkdown('x.md','# G\n\n'+md);
  ok('a slide with a formula survives markdown',back[0].body===body,
     CUT(JSON.stringify(back[0].body||''),90));

  // ---------- the markdown editor points at what you clicked ----------
  w.cur=0;w.editMarkdown();await wait(350);
  const src=d.getElementById('seSrc'),pv=d.getElementById('sePv');
  ok('the preview is linked',pv.classList.contains('linked'));
  const marked=pv.querySelectorAll('[data-b]');
  ok('rendered blocks say which block they are',marked.length>=3,marked.length+' tagged');
  const rs=w.slideRanges(src.value,w.S.slides[0]);
  ok('each block has a place in the source',rs.length>=3&&rs.every(r=>r&&r.start>=0),
     JSON.stringify(rs.slice(0,3)));
  ok('and that place really is that block',
     src.value.slice(rs[0].start,rs[0].end)==='#### Scoring',
     JSON.stringify(src.value.slice(rs[0].start,rs[0].end)));
  const target=marked[1];
  target.dispatchEvent(new W.MouseEvent('click',{bubbles:true}));
  await wait(120);
  ok('clicking a block selects its source',
     src.selectionStart===rs[+target.dataset.b].start&&src.selectionEnd===rs[+target.dataset.b].end,
     CUT(src.value.slice(src.selectionStart,src.selectionEnd),30));
  ok('and the block is outlined',!!pv.querySelector('.srcon'));
  // and the other way
  src.setSelectionRange(rs[0].start+2,rs[0].start+2);
  src.dispatchEvent(new W.Event('keyup'));await wait(120);
  ok('putting the caret in the source outlines that block',
     pv.querySelector('.srcon')===pv.querySelector('[data-b="0"]'));
  d.getElementById('seNo').click();await wait(150);

  // ---------- it is not just markup: the browser lays it out ----------
  w.S.slides[0].body='A line of ordinary text.';w.cur=0;w.paint();await wait(250);
  const plain=d.querySelector('#sheet .tx p').getBoundingClientRect().height;
  w.S.slides[0].body='$$ \\frac{a}{b} $$';w.paint();await wait(250);
  const mel=d.querySelector('#sheet math');
  ok('a formula reaches the slide as MathML',!!mel,mel&&mel.tagName);
  const box=mel.getBoundingClientRect();
  ok('and the browser gives it a size',box.width>4&&box.height>4,
     Math.round(box.width)+'×'+Math.round(box.height));
  ok('a fraction is taller than a line of text',box.height>plain,
     Math.round(box.height)+' vs '+Math.round(plain));
  w.S.slides[0].body='Inline $x^2$ here.';w.paint();await wait(250);
  const inm=d.querySelector('#sheet .tx math');
  ok('inline maths sits in the paragraph',!!inm&&!!inm.closest('p'));
  ok('and stays on the line',inm.getBoundingClientRect().height<plain*2.2,
     Math.round(inm.getBoundingClientRect().height)+' vs line '+Math.round(plain));
  w.S.slides[0].body='```js\nconst x = 1;\n```';w.paint();await wait(250);
  ok('a code block reaches the slide',!!d.querySelector('#sheet pre.cb code'),
     (d.querySelector('#sheet pre.cb code')||{}).textContent);
  w.S.slides[0].body='#### A heading inside the slide\n\nAnd a line under it.';
  w.paint();await wait(250);
  ok('a sub-head reaches the slide',!!d.querySelector('#sheet .tx h3.bh'),
     (d.querySelector('#sheet .tx h3.bh')||{}).textContent);
  ok('and is heavier than the text under it',
     parseInt(getComputedStyle(d.querySelector('#sheet .tx h3.bh')).fontWeight)
     > parseInt(getComputedStyle(d.querySelector('#sheet .tx p')).fontWeight));

  // ---------- and no browser dialogs anywhere ----------
  let popped=0;
  W.confirm=()=>{popped++;return true;};
  W.alert=()=>{popped++;};
  const n0=w.S.slides.length;
  w.cur=2;w.deleteSlide(2);await wait(200);
  ok('deleting opens no window',popped===0);
  ok('it just deletes',w.S.slides.length===n0-1);
  ok('and offers the way back where you can see it',
     !!d.getElementById('nudge')&&/Undo/.test(d.getElementById('nudge').textContent),
     (d.getElementById('nudge')||{}).textContent);
  d.getElementById('nudgeGo').click();await wait(200);
  ok('which puts the slide back',w.S.slides.length===n0);
  ok('the app has no confirm() left in it',
     !/[^a-zA-Z.]confirm\(/.test(W.document.documentElement.innerHTML.replace(/confirm\(\) standing/g,'')));
  // ---------- one slide can carry all of it at once ----------
  w.S.slides[0].body=
    'Words, **bold** and `code`.\n\n#### A heading\n\n'+
    '| a | b |\n|---|---|\n| 1 | 2 |\n\n'+
    'A formula inline $x^2$ and a link https://example.org/x\n\n'+
    '```bash\nrun --it\n```\n\n***\n\n> The line that lands.';
  w.S.slides[0].layout='text';w.S.slides[0].textScale=100;
  w.cur=0;w.paint();await wait(400);
  const sl=d.getElementById('stage');
  const has={heading:!!sl.querySelector('.tx h3.bh'),table:!!sl.querySelector('.tx table'),
             maths:!!sl.querySelector('.tx math'),code:!!sl.querySelector('.tx pre.cb'),
             link:!!sl.querySelector('.tx a'),rule:!!sl.querySelector('.tx hr.rule'),
             quote:!!sl.querySelector('.tx blockquote')};
  ok('a heading, a table, a formula, code, a link, a rule and a quote on one slide',
     Object.values(has).every(Boolean),JSON.stringify(has));
  const bd2=sl.querySelector('#bd')||sl.querySelector('.txin'),tx2=sl.querySelector('.tx');
  const kk=sl.getBoundingClientRect().width/1280;
  ok('and all of it fits on a slide of its own',
     bd2.getBoundingClientRect().height/kk<=tx2.getBoundingClientRect().height/kk+2,
     Math.round(bd2.getBoundingClientRect().height/kk)+' in '+Math.round(tx2.getBoundingClientRect().height/kk));

 }catch(e){L.push('ERROR '+e.message+' @ '+(e.stack||'').split('\n')[1]);}
 clearTimeout(__watchdog);
 document.body.insertAdjacentHTML('beforeend','<pre id=out>'+L.join('\n')+'</pre>');
});
