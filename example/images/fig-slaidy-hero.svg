<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" font-family="system-ui,sans-serif">
<style>
.mv,.wp{animation:mv 10.0s linear infinite}
.wp{animation-name:wp}
.bo{animation:bo 10.0s linear infinite}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 10.0s linear infinite backwards}
.dot,.spark{transform-box:fill-box;transform-origin:center;animation:pop 10.0s linear infinite backwards}
.spark{animation-name:spark;opacity:0}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 10.0s ease-out infinite backwards;opacity:0}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
.caret{animation:blink 1s steps(1) infinite}
